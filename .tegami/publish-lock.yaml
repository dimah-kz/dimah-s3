core:changelogs:
  - content: "---\npackages:\n  group:dimah-s3:\n    type: minor\n---\n\n### A plugin SDK for third-party plugins\n\nPlugins get resolved routes, in-process calls behind the guards, their own error codes, a client typed by the server, and a test kit. Each package changelog lists its own changes. The [Plugins](https://s3.dimah.dev/docs/server/plugins) guide builds one end to end, and [Testing](https://s3.dimah.dev/docs/server/testing) covers `@dimah-s3/server/testing`. The [upgrade guide](https://s3.dimah.dev/docs/migration-2-0#update-plugins) lists what a plugin written for an earlier beta changes.\n"
    filename: 2026-11-23-plugin-sdk-line.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    type: major\n---\n\n### Typed client plugins and plugin error codes\n\nA client plugin reads its types from the server plugin, and plugins define error codes the same way the core catalog does.\n\n- **Typed `$fetch`.** With `$InferServerPlugin`, the `$fetch` that `getActions` receives is typed by the server plugin's endpoints: the path and method pick one, its schema types `query` and `body`, and the result is its handler's return type (`S3PluginFetch`, `S3EndpointFetch`). A path, method, or body the server does not accept fails to compile.\n- **`$ERROR_CODES` on client plugins.** Merged into the client's `$ERROR_CODES`, with their types. A code that is already there throws at `createS3Client()`.\n- **`s3Error(entry, params)` and `isS3ErrorCode(error, entry)`.** Both take an entry of any `defineErrorCodes` catalog, besides a core code. `params` are typed by the message's `{placeholders}` (`S3ErrorEntryParams`).\n- **`pluginPath` keeps the literal path** (`PluginPath`), so a typed `$fetch` matches it.\n- **`S3ErrorCatalog` and `S3ErrorCodeEntry`** type a catalog and one of its entries.\n\n#### Breaking changes\n\n- **Drop the type argument from a typed `$fetch`.** With `$InferServerPlugin` set, `$fetch<T>(path, options)` does not compile. Call `$fetch(path, options)`: the result has the endpoint's type.\n- **Build valid codes with `defineErrorCodes`.** It throws for a code that is not uppercase snake case, a status outside 100–599, or an empty message.\n"
    filename: 2026-11-23-plugin-sdk-core.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    type: major\n---\n\n### db() on the plugin SDK\n\n`db()` reads the resolved routes and runs `s3.db.record` through the plugin SDK, so every guard applies to it.\n\n- **`s3.db.record` runs every guard.** Every plugin's instance guard runs, then the user's instance guard and the route guard. A guard another plugin adds, such as auth or a rate limit, now applies to it.\n- **`s3.db.record` fails with an `APIError`.** An unexpected failure is logged, passed to `onError`, and becomes `500 INTERNAL_ERROR`, as from `s3.api`.\n- **Guards name the db action.** A `/db/*` call carries `plugin: { id: \"db\", action }`, where `action` is the `dbClient()` method: `listObjects`, `getObject`, `updateObject`, `createFolder`, `updateFolder`, or `deleteFolder`.\n- **`dbClient()` is typed by `db()`.** Its responses come from the endpoint types, so the client and the server stay in step.\n\n#### Breaking changes\n\n- **Compare `plugin.action` in guards.** The instance and route guards no longer receive `operation: \"record\"` from `s3.db.record`: they receive `operation: \"plugin\"` with `plugin.action === \"record\"`.\n"
    filename: 2026-11-23-db-plugin-sdk.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    type: minor\n---\n\n### Move and delete folders from dbObjectSource\n\n`dbObjectSource` moves files and folders and deletes folders with everything in them, through the endpoints `db()` already has.\n\n- **Move.** `moveFile` sends the new `folderId` to `api.db.updateObject`, and `moveFolder` the new `parentId` to `api.db.updateFolder`. The object key stays. Set when `folders` is on.\n- **Folder delete.** `listFolderKeys` pages through `GET /db/objects` with `recursive` and the source's filters, so the list can delete those objects with `useDelete`. `deleteFolder` then calls `api.db.deleteFolder({ id, recursive: true })`. Set when `folders` is on, and `deleteFolder` when `api.db` has it.\n- **`DELETE /db/folder?recursive=true`.** Removes the folder and the folders below it, deepest first, as long as none of them holds an active or pending object. A folder with one is `FOLDER_NOT_EMPTY`; the empty folders removed before it stay removed. `authorize` sees the folder the call names. `api.db.deleteFolder` takes `recursive`.\n- **`s3.db.folders.delete(scope, id, { recursive })`.** The same on the server.\n"
    filename: 2026-11-23-object-list-move-db.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    type: major\n---\n\n### Move entries and delete folders with useObjectList\n\nA source can move files and folders and delete folders, and `useObjectList` runs those actions on the loaded rows. `uploadOptions` can wait for work such as creating a folder.\n\n- **`moveFile` and `moveFolder` on the source.** Each takes the entry and the destination `parent` (`null` is the root). The object key stays as you store it.\n- **`list.moveEntries(entries, parent)`.** Moves through the source one entry at a time, drops the moved rows, and reloads once. It never rejects and resolves with `ObjectListMoveResult`: `moved`, and `failed` with each `APIError`. Entries already in `parent` are left alone, and a folder moved into itself fails with `FOLDER_INVALID`. Set when the source has `moveFile` or `moveFolder`.\n- **`list.canMove(entry)`.** Whether the source can move that entry. Pass `\"file\"` or `\"folder\"` to ask about a kind.\n- **`listFolderKeys` and `deleteFolder` on the source.** `listFolderKeys({ folder, signal })` returns the object keys in a folder and every folder below it. `deleteFolder({ folder })` removes the folder and the folders below it once their files are gone. The list returns both: `list.deleteFolder(folder)` drops the folder row, and opens the folder that held it when it was open.\n- **`list.listFolders(parent)`.** The folders inside any folder, from the source's first page there, for a folder picker.\n- **`list.createFolder(name, { parent })`.** Creates the folder in another folder. Only a folder created in the open one joins the loaded rows.\n- **`memoryObjectSource` names folder keys.** With `getFolder`, it returns `listFolderKeys`.\n- **Folders join the selection.** `useObjectListSelection` selects files, and folders too when the list can delete or move them. Pass `isSelectable` to choose yourself.\n- **`uploadOptions` may return a promise.** A function in `uploadOptions` runs as each file starts. The file stays `preparing` until the promise settles, and cancelling it stops the wait.\n\n#### Breaking changes\n\n- **Match the code of an `APIError` that `uploadOptions` throws.** The file fails with that error. Any other throw or rejection still fails it with `HOOK_FAILED`.\n"
    filename: 2026-11-23-object-list-move-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    type: minor\n---\n\n### Word plugin error codes\n\n- **`formatError` on `S3Provider`.** Your message for an API error (`S3ErrorFormatter`). `useFormatError` and every UI toast ask it first, for plugin codes and catalog codes alike, and `undefined` keeps the built-in message. Without it, a plugin's code shows the English message the server sent.\n"
    filename: 2026-11-23-plugin-error-messages-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    type: minor\n---\n\n### Hook results keep their identity\n\nThe objects that `useUpload`, `useDownload`, `useFetchDownload`, `useDelete`, `useObjectUrl`, `useObjectList`, `useObjectListSelection`, and `useRouteUploadPolicy` return stay the same object until a value in them changes, so they can go in effect dependencies and context values.\n\n- **`upload.policy`** stays the same object while the route policy is the same, also when `accept` is a new array on every render.\n- **`upload.getRootProps`, `getInputProps`, and `getDropTargetProps`** keep their identity while the policy and the hook options do.\n- **`useObjectList`** keeps its result while the source functions you pass keep theirs.\n"
    filename: 2026-11-23-stable-hook-results.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    type: major\n---\n\n### Pause and resume uploads\n\n`useUpload` pauses files and resumes them where they stopped. A multipart upload continues from the parts S3 already has, with or without an `uploadStore`, while the page stays open.\n\n- **`upload.pause(ids?)`.** Stops one file, several, or every file, including the files of a call still preparing. A paused file stays in the queue with its progress, as phase `\"paused\"`, and frees its upload slot. A file that is `\"finalizing\"` finishes instead.\n- **`upload.resume(ids?)`.** Queues paused files again. A multipart upload continues from its uploaded parts; a single-shot upload starts over. The request options resolved before the pause are sent again, so an `uploadOptions` function does not run twice.\n- **A paused file has not ended.** The `handleFiles` promise, `onSuccess`, `onError`, and `onSettled` wait until it is resumed and finishes, or is cancelled.\n- **Without an `uploadStore`.** The hook keeps the multipart session of a paused file for the page session. A cancel, a failure, `detach()`, or an unmount aborts it, as before.\n- **`reset()` keeps paused files.** It removes only files that uploaded or failed. `cancel()` removes a paused file and aborts its multipart upload; `detach()` and an unmount remove it and keep its record in an `uploadStore`.\n\n#### Breaking changes\n\n- **Handle `\"paused\"` in `UploadFilePhase` and `UploadPhase`.** A file is `\"paused\"` between `pause` and `resume`. The queue is `\"paused\"` while a file is paused and none is in flight; `isPending` is then `false`. A `switch` that lists every phase needs the new case.\n"
    filename: 2026-11-23-upload-pause-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/server\":\n    type: major\n---\n\n### A plugin SDK with resolved routes, in-process calls, error codes, and a test kit\n\n`definePlugin` gets what a third-party plugin needs to work like `db()`, without reaching into the config.\n\n- **`env.routes`.** `init` receives every route as `dimahS3()` resolved it (`PluginRoute`): the client and bucket it inherits, its `keyPrefix`, which features are on, the upload file limits, and the plugin's own options.\n- **`env.runOperation`.** Runs a plugin's in-process call the way `s3.api` runs one: every instance guard, then the route guard when the call names a route, then the call. Failures leave as an `APIError`, and an unexpected one is logged and passed to `onError`.\n- **`plugin` in guard contexts.** Every plugin call, an endpoint or an in-process call, carries `plugin: { id, action }` (`PluginCall`). For an endpoint, `action` is its key in `endpoints`.\n- **`$ERROR_CODES` on plugins.** Codes built with `defineErrorCodes` are merged into `s3.$ERROR_CODES`, with their types. A code the core catalog or another plugin already has throws at `dimahS3()`.\n- **Typed route options.** `env.routeOptions(route)` and `env.routes[name].options` are typed by the plugin's `DimahS3RoutePluginOptions` augmentation, with no type argument.\n- **Endpoint types.** `definePlugin` keeps the `endpoints` type, so a client plugin that names the server plugin gets a typed `$fetch`.\n- **`assertStoredKey`.** `@dimah-s3/server/plugins` exports the check that a key sits inside a route's namespace.\n- **`@dimah-s3/server/testing`.** `createTestInstance` runs an instance on an in-memory S3 with a browser client wired to its handler, and `upload` sends a file the way the browser does. `createMemoryS3`, `createTestClient`, and `uploadTestFile` are the parts. Node.js only.\n\n#### Breaking changes\n\n- **Put plugin endpoints under the plugin id.** A path is `/{id}` or `/{id}/…`; build it with `pluginPath(id, path)`. Any other path throws at `dimahS3()`.\n- **Use a valid plugin id.** An id is a letter followed by up to 63 letters, digits, `_`, or `-`. `presign`, `file`, `routes`, and `delete` are reserved, next to the instance keys.\n- **Compare `plugin.action` instead of `operation: \"record\"`.** `S3Operation` has no `\"record\"`: `s3.db.record` runs as `operation: \"plugin\"` with `plugin: { id: \"db\", action: \"record\" }`.\n"
    filename: 2026-11-23-plugin-sdk-server.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/ui\":\n    type: major\n---\n\n### Move, folder delete, thumbnails, and folder drops in ObjectList\n\n`ObjectList` moves entries, deletes folders with what they hold, shows image thumbnails, and keeps the folders of a dropped folder. Each turns on from the source or a prop.\n\n- **Move.** When the source has `moveFile` or `moveFolder`, entries have **Move to…** in their menu and the selection bar has **Move**. The Move dialog opens in the open folder; browse to a folder and choose **Move here**. A folder cannot be opened in the dialog while it moves. A row dragged onto a folder row, or onto the root or the parent in the path, moves there, and a selected row takes the selection with it. `ObjectListBulkMove` is the Move button for a selection bar of your own, and `startMove(entries, { trigger })` on `useObjectListContext()` opens the dialog.\n- **Folder delete.** With `delete` and a source that has `deleteFolder`, folders have Delete in their menu and join a bulk delete. After the one confirmation, `listFolderKeys` names each folder's files, `delete` removes them with the selected files in one request, and `deleteFolder` removes each folder whose files all went. A folder with a file that failed stays.\n- **The Delete key.** Delete, or Cmd+Backspace on a Mac, asks to delete the selection, else the focused entry.\n- **`thumbnails`.** `thumbnails={{ route }}` signs a picture for each PNG, JPEG, GIF, WebP, AVIF, SVG, BMP, or ICO file without a `previewUrl`, once its row or tile comes into view, and signs it again before it expires. Pass `api` without an `S3Provider`. `ObjectListThumbnails` is its type.\n- **Dropped folders keep their folders.** With `uploadOptions` and `createFolder` on the source, the folders inside a dropped folder are found by name below the folder it lands in, or created as their first file starts, and their files upload there. An `UploadDropzone` inside the list does the same.\n- **Delete requests carry their own copy and work.** `request(targets, options)` from `useDeleteContext()` takes `title` and `description` for the dialog, and `run(remove)` to delete in place of the targets, such as a folder and its files; `targets` may then be empty. The dialog stays busy until `run` settles. `DeleteTargetsFn` is the type of `remove`.\n\n#### Breaking changes\n\n- **Move `resolveFolderKeys` to the source as `listFolderKeys`, and add `deleteFolder`.** `ObjectList` no longer takes `resolveFolderKeys`. `dbObjectSource` sets both, and `memoryObjectSource` sets `listFolderKeys`. Without `deleteFolder`, folders have no Delete and stay out of a bulk delete.\n"
    filename: 2026-11-23-object-list-move-ui.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/ui\":\n    type: patch\n---\n\n### ObjectList fits phones and touch screens\n\n`ObjectList` keeps its header on one row on a phone, gives the rename field room, and sizes its controls for a finger on a touch screen.\n\n- **One header row.** The path keeps 6rem instead of 11rem, so the controls stay beside it down to a narrow phone. `ObjectListViewToggle` shows one button under a 28rem header: the view to switch to.\n- **Rename field.** In a tile the field takes the whole width, with Cancel and a filled Save under it. In a row the menu steps aside while the name is a field.\n- **Touch sizes.** On a coarse pointer, the header's controls are 32px, the row menu and the rename buttons 36px, and the rows of the Move dialog 44px. The path and the dialog's buttons grow too.\n- **No zoom on focus.** The rename, New folder, and search fields use 16px text on small screens, so iOS does not zoom the page when one takes focus.\n"
    filename: 2026-11-23-object-list-touch.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/ui\":\n    type: major\n---\n\n### Toaster, toast, and Attachment parts with props of their own\n\nThe npm exports that render shadcn primitives take props `@dimah-s3/ui` defines, so a primitive update cannot change them.\n\n- **`Toaster`.** Takes `limit` (default `3`), `timeout` (default `5000` ms, `0` keeps toasts open), and optional `children`. `ToasterProps` is its type.\n- **`toast`.** `toast.add(options)` returns an id, `toast.update(id, options)` changes an open toast, and `toast.close(id?)` closes one or every toast. `ToastOptions` holds `title`, `description`, `type` (`ToastType`), `timeout`, `priority`, `action`, and `onClose`.\n- **`AttachmentGroup`, `AttachmentAction`, and `AttachmentTrigger`.** Their props are `AttachmentGroupProps` (a `<div>`), `AttachmentActionProps` (a `<button>` plus `focusableWhenDisabled`), and `AttachmentTriggerProps` (a `<button>`, or the element `render` returns).\n- **`AttachmentState`.** The union `\"idle\" | \"uploading\" | \"processing\" | \"error\" | \"done\"`, no longer read from the shadcn Attachment.\n- **`useToastOwner` for your own toasts.** Call it in a toast component built on another library, and show toasts only while it returns `true`: the `ObjectList` built-in toasts step aside. `UseToastOwnerOptions` is the type of its `{ weak }` options.\n\n#### Breaking changes\n\n- **Pass `action: { label, onClick }` to `toast.add`.** `actionProps` is replaced. `toast.promise`, `toast.subscribe`, and `data` are removed; show a loading toast with `type: \"loading\"` and `timeout: 0`, then `toast.update` it.\n- **Drop `toastManager` from `<Toaster>`.** It takes only `limit`, `timeout`, and `children`.\n- **Style `AttachmentAction` with `className`.** It no longer takes the Button `variant` and `size` props.\n"
    filename: 2026-11-23-ui-own-props.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/ui\":\n    type: major\n---\n\n### Pause and resume in the upload family\n\n`UploadStatus`, `UploadFileList`, `UploadToasts`, and `AvatarUpload` show paused files and resume them through `upload.resume`.\n\n- **Pause in `UploadStatus`.** It appears while a multipart upload is in flight, since that upload resumes from its uploaded parts, and calls `upload.pause()`.\n- **Paused files.** A paused file reads \"Paused\", keeps its progress ring, and has a resume action next to cancel. Once every file in flight is paused, the multi-file summary reads \"{percent}% · Paused\" and offers resume for all of them; dismiss waits until the queue settles.\n- **`UploadToasts`.** While the queue is paused, the progress toast reads \"Upload paused\" with a Resume action, and the result toast waits until the queue settles.\n- **`AvatarUpload`.** A paused image keeps its preview and its progress ring, and the live region says \"Paused\".\n- **Translations.** New keys: \"Paused\" (note `upload status`), \"Resume\" (`upload control`), \"Resume {name}\" (`attachment action`), \"Upload paused\" (`toast`), and \"Resume\" (`toast action`).\n\n#### Breaking changes\n\n- **Expect Pause in `UploadStatus` to keep files in the queue.** It calls `upload.pause()` in place of `upload.detach()`, so the files stay, paused, until resumed or cancelled. It shows for a multipart upload with or without an `uploadStore`, and no longer for a smaller file that would start over. Call `upload.detach()` from your own control to stop and clear the queue.\n"
    filename: 2026-11-23-upload-pause-ui.md
    v: 0.0.0
