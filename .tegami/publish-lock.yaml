core:changelogs:
  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    type: patch\n---\n\n### Encode large base64url values directly\n\nBase64 encoding writes each group of bytes itself, so a large value finishes instead of stalling.\n"
    filename: 2026-11-03-base64url-direct.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    type: patch\n---\n\n### Fix base64url on large inputs\n\nEncoding and decoding a large base64url value no longer stalls.\n"
    filename: 2026-11-03-base64url-large.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    type: major\n---\n\n### One database schema\n\n`@dimah-s3/db` reads schema `2.0.0` only. A database already at `2.0.0` is unchanged.\n\n#### Breaking changes\n\n- **No upgrade from a 1.x database.** `sql/upgrade/1.0.0-2.0.0/` is gone, and `migrate(client)` only creates schema `2.0.0`. Create the tables on a new database with `sql/<dialect>.sql`, your ORM, or `migrate(client)` on an empty database. A database at any other version throws. See [Upgrade the database](https://v2.s3.dimah.dev/docs/db/upgrade).\n- **`v2` is no longer exported.** The schema is internal. `DB_SCHEMA_VERSION` is still `2.0.0`.\n"
    filename: 2026-11-02-db-single-schema.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    type: patch\n---\n\n### Copy the Drizzle schema into your app\n\nCopy `src/drizzle/sqlite.ts`, `pg.ts`, or `mysql.ts` from the package into your schema when you want to add columns. Keep the table and column names. Importing `dimahS3Tables` from `@dimah-s3/db/drizzle/*` still works when you leave the tables as they are.\n"
    filename: 2026-11-03-drizzle-schema-copy.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/server\":\n    type: patch\n---\n\n### Fix proxy downloads that never finish\n\n`GET /file` through the Node adapter now writes the object body directly. A download larger than the stream buffer no longer stalls until the client gives up.\n"
    filename: 2026-11-03-node-file-stream.md
    v: 0.0.0
