  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/core)\n---\n\n### Folder not found\n\n`FOLDER_NOT_FOUND` (`404`) is the error when a folder id is not in the caller's scope.\n"
