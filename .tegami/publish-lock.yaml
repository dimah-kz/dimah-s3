  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/core)\n---\n\n### One way to match search text\n\n`@dimah-s3/core` exports the folding that list search uses everywhere, so your own source or renderer matches names the way `db()` and `memoryObjectSource` do.\n\n- **`normalizeSearchText(value)`** lowercases, drops accents and other combining marks, joins look-alike letters (`ي`/`ی`, `ك`/`ک`, final `ς`, `ß` as `ss`), reads Persian and Arabic-Indic digits as `0`–`9`, removes zero-width joiners and the tatweel, and collapses whitespace.\n- **`matchesSearchText(text, search)`** is true when the folded `text` contains the folded `search`. Blank search text matches everything.\n- **`findSearchMatches(text, search)`** returns the `[start, end)` ranges of each match in `text`, for a highlight. A combining accent stays with its letter.\n"
    filename: 2026-11-15-search-text-core.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/core)\n  \"@dimah-s3/server\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/server)\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Types resolve under NodeNext\n\nThe declaration files of `@dimah-s3/core`, `@dimah-s3/server`, `@dimah-s3/react`, and `@dimah-s3/db` import each other by their `.js` paths. A project with `moduleResolution` set to `NodeNext` or `Node16` gets the same types as one on `Bundler`.\n\n- **`export *` names resolve.** Importing `buildObjectKey` or another re-exported helper from `@dimah-s3/core` no longer fails with `TS2305`.\n- **Values keep their types.** `dimahS3`, `route`, `useUpload`, `db`, and the other re-exported values are no longer `any`. Code that passed `tsc` only because they were `any` now reports its type errors.\n- **`skipLibCheck: false` passes.** `tsc` no longer reports `TS2834` or `TS2835` inside these packages.\n"
    filename: 2026-11-16-nodenext-types.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/core)\n---\n\n### One name for client metadata\n\nThe upload body, the client option, and the server hooks all call the client's extras `clientMetadata`, so `metadata` always means the object's S3 user metadata.\n\n- **`QUOTA_EXCEEDED` names a third cap.** Its `limit` param can be `\"folders\"`, next to `\"bytes\"` and `\"files\"`, for the folder cap of `db()`.\n\n#### Breaking changes\n\n- **Send `clientMetadata`, not `metadata`.** The upload and multipart init bodies (`UploadPayload`, `MultipartInitPayload`, `uploadBodySchema`, `multipartInitBodySchema`) take `clientMetadata`. A body that still sends `metadata` fails with `VALIDATION_ERROR`. A custom `S3Api` reads `payload.clientMetadata`.\n- **`metadataSchema` is `clientMetadataSchema`**, and `S3_MAX_METADATA_ENTRIES` is `CLIENT_METADATA_MAX_ENTRIES`.\n- **`UNKNOWN_ROUTE` is `ROUTE_NOT_FOUND`**, like `OBJECT_NOT_FOUND` and `FOLDER_NOT_FOUND`. The status stays `404` and the message is unchanged.\n- **`buildPublicObjectUrl({ baseUrl })` is `buildPublicObjectUrl({ baseURL })`**, spelled like `createS3Client({ baseURL })`.\n"
    filename: 2026-11-20-client-metadata.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/core)\n---\n\n### Typed client plugins and plugin error codes\n\nA client plugin reads its types from the server plugin, and plugins define error codes the same way the core catalog does.\n\n- **Typed `$fetch`.** With `$InferServerPlugin`, the `$fetch` that `getActions` receives is typed by the server plugin's endpoints: the path and method pick one, its schema types `query` and `body`, and the result is its handler's return type (`S3PluginFetch`, `S3EndpointFetch`). A path, method, or body the server does not accept fails to compile.\n- **`$ERROR_CODES` on client plugins.** Merged into the client's `$ERROR_CODES`, with their types. A code that is already there throws at `createS3Client()`.\n- **`s3Error(entry, params)` and `isS3ErrorCode(error, entry)`.** Both take an entry of any `defineErrorCodes` catalog, besides a core code. `params` are typed by the message's `{placeholders}` (`S3ErrorEntryParams`).\n- **`pluginPath` keeps the literal path** (`PluginPath`), so a typed `$fetch` matches it.\n- **`S3ErrorCatalog` and `S3ErrorCodeEntry`** type a catalog and one of its entries.\n\n#### Breaking changes\n\n- **Drop the type argument from a typed `$fetch`.** With `$InferServerPlugin` set, `$fetch<T>(path, options)` does not compile. Call `$fetch(path, options)`: the result has the endpoint's type.\n- **Build valid codes with `defineErrorCodes`.** It throws for a code that is not uppercase snake case, a status outside 100–599, or an empty message.\n"
    filename: 2026-11-23-plugin-sdk-core.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Schema 2.3.0: folder ids, attributes, and generated tables\n\nThe `db()` plugin uses database schema `2.3.0`. A folder is a row with an id, an object stores `folderId`, and S3 metadata (`s3Metadata`) is split from your own typed `attributes`. `storage_folder` stores `parent_id` (`\"\"` is the root), `name`, and a cached `path`. Create the schema on a new database. A `1.x` database and a `2.0.0` beta database are not upgraded.\n\n- **Setup without FumaDB imports.** Import adapters from `@dimah-s3/db/adapters/drizzle`, `/adapters/kysely`, or `/adapters/prisma`, and generate the Drizzle tables or Prisma models with `runCli` from `@dimah-s3/db/cli`.\n- **New options:** `getSession(request)` (called at most once per request), `authorize(context)` after the ownership check, `quota` as an object or a function of the session, and `attributes: { schema, toClient?, maxBytes? }` with any Standard Schema validator.\n- **New endpoints and actions:** `GET /db/object` (`getObject`), `PATCH /db/object` (`updateObject`, for `name`, `folderId`, and `attributes`), `POST /db/folder` (`createFolder` with `{ parentId, name }`), `PATCH /db/folder` (rename with `name`, move with `parentId`), and `DELETE /db/folder` (`deleteFolder` by `id`). An upload's `clientMetadata.folderId` must name a folder that already exists.\n- **`dbObjectSource(api.db, { route, folders })`** lists one folder at a time. `parent` is a folder id (`null` is the root). It provides `uploadOptions(parent)` and `createFolder({ parent, name })` so `ObjectList` uploads into the open folder and creates folders.\n- **Safer lifecycle.** Upload tickets are bound to the scope. A pending row expires with its ticket. Confirm is a compare-and-set, so a replayed confirm returns the stored row. Quota is checked again against the verified size at confirm. An overwrite keeps the old object listed and downloadable until the new one is confirmed, with its folder, attributes, and `createdAt`.\n- **Purge.** `s3.db.purgeStale({ limit })` claims each stale row for a 15-minute lease, aborts its multipart upload, and deletes an object only when its upload marker still matches. A failed row is retried after the lease. `s3.db.pruneDeleted({ olderThan })` removes soft-deleted rows.\n- **`s3.db.checkSchema()`** fails fast at startup when the database is not at `2.3.0`.\n- **MySQL collations.** Text columns compare byte for byte (`utf8mb4_bin`). The name sort reads the folded `search_name`, so it ignores case and accents on every database.\n\n- **Safer overwrites and confirms.** A retried confirm after a later overwrite started is a replay, not a rejection that deleted the live object. `upsertPending` is a real compare-and-set on the row it read, and a re-upload over a deleted row gets a new row id. When the server deletes `upload.object().previousKey`, its row is retired too, so it stops counting toward the quota.\n- **Quota** counts the declared bytes of an overwrite in flight.\n- **Folders.** Creating and deleting a folder are race-safe: a delete that loses to an upload restores the folder. Every ancestor is checked in one query.\n- **Listings.** `contentType` accepts `type/*` (`image/*`). With `search`, the first page lists only the child folders whose name contains it.\n- **Tenant isolation.** A key another scope holds is `OBJECT_NOT_FOUND` on download, delete, read, update, confirm, and the multipart calls, the same as a missing key, so a caller cannot learn which keys exist. `objects.update` is pinned to the row that was checked.\n- **Purge** returns `{ purged, failed, skipped, more }`. A row whose route has no S3 client fails and is kept, instead of dropping the row and orphaning its object. A database at a newer schema says to upgrade `@dimah-s3/db`.\n- **Deleting a soft-deleted object again succeeds,** like a plain S3 delete.\n- `PATCH /db/object` checks access before it runs your attributes schema, and `attributes: null` clears them.\n\n#### Breaking changes\n\n- **Schema `2.3.0` is created, not upgraded.** `sql/upgrade/` is gone. Create the tables on a new database with your ORM from the generated schema, or with `migrate(client)` from `@dimah-s3/db` on an empty database. A database at any other version throws.\n  - `metadata` is split into `s3Metadata` and `attributes`.\n  - An object stores `folder_id` and `upload_token`. `storage_folder` stores `parent_id`, `name`, a cached `path`, and `updated_at`. Rows have a `purging` status, new indexes, and a required `name`.\n- **Setup.** Remove `fumadb` and the `fumadb/cuid` path alias from your app. `fumadb` is now a pinned dependency of `@dimah-s3/db`, and its adapters are re-exported. Drizzle users must keep every table key of the generated schema, including `private_dimah_s3_settings`. The `drizzle-orm` peer is now `>=1.0.0-rc.5 <2.0.0`: the Drizzle adapter and tables need `drizzle-orm` 1.0.0-rc.5 or later, and 0.44 and 0.45 are no longer supported. Upgrade `drizzle-orm` first.\n  - The copy-paste schemas in `src/schema/examples/` are no longer published. Generate the schema with `runCli` → `generate`.\n- **Options.**\n  - `resolveScope` receives `{ request, locals, session, operation, route? }`. `operation` gains `\"read\"` for `GET /db/object`. It runs once per call and target, not once per `Request`, so two `s3.api` calls with the same `Request` but different `locals` resolve separately. `getSession` is still cached per `Request`.\n  - An upload on a `replace: \"overwrite\"` route that replaces an active object runs `authorize` with `object` set to that object. `folderId` is that object's folder id, not `clientMetadata.folderId`.\n  - `authorize` replaces `createObjectAccessGuard`. `quota` accepts a function and replaces `createQuotaGuard`. Both helpers are removed.\n  - `pendingTtlMs` is removed: pending rows expire with the upload ticket.\n  - Overwrites are set per route with `plugins: { db: { replace: \"overwrite\" } }`.\n  - `plugins: { db: false }` still turns tracking off for a route. Such a route issues unbound tickets and logs a warning at startup when its download or delete has no guard.\n  - `TClientAttributes` defaults to the schema output.\n- **Behavior.**\n  - `s3.put` now tracks rows.\n  - Usage ignores expired pending rows. `QUOTA_EXCEEDED` is now 403.\n  - An upload to a key that purge is cleaning up returns `CONFLICT`.\n- **Store (`s3.db.objects`).** `listByScope` is now `list(scope, filter)`, `countByScope` is `count(scope, filter)`, and `getScopeUsage` is `usage(scope)`. `findByScopeKey`, `findActive`, `deleteByIds`, the `offset` option, and `s3.db.client` are removed. `deletePending` is replaced by `cancelUpload` and `discardUpload`.\n- **Purge.** `purgeStalePendingObjects` is replaced by `s3.db.purgeStale({ limit })` and `s3.db.pruneDeleted({ olderThan })`. A number for `olderThan` is a timestamp in milliseconds, not a duration.\n- **HTTP.**\n  - `GET /db/objects` drops `offset` and `prefix` (they now return `400`) and takes `folderId`, where `\"\"` is the root. `usage`, `limits`, and `folders` come on the first page only, and `nextCursor` is always present. A cursor made under other filters restarts at the first page.\n  - `GET /db/objects` returns `400` for `status=purging`. The `status` of `DbClientListObjectsInput` and `DbObjectSourceOptions` no longer allows `purging`.\n  - Body endpoints accept JSON only.\n  - When routes use more than one bucket, `GET` and `PATCH /db/object` require `bucket`.\n- **Client (`@dimah-s3/db/client`).**\n  - `DbClientObject` gains `folderId` (`null` is the root), `updatedAt`, and `attributes`. `updatedAt` is a sort field of its own.\n  - `dbObjectQuery` and `dbObjectListAccessors` are replaced by `dbObjectSource(api.db, { route, folders })`, whose `parent` is a folder id (`null` is the root). `getFile().updatedAt` is the row's `updatedAt`, and sorting by date uses the same field.\n  - `DbObjectListSource`, `DbObjectQueryInput`, `DbObjectQueryOptions`, `DbObjectQueryPage`, `DbObjectListAccessors`, and `DbObjectListAccessorsOptions` are removed. Read a row's file fields with `source.getFile(row)`, and use the `DbObjectSource*` types.\n- **Removed exports.** `v1`, `conflict`, `forbidden`, `notFound`, `unauthorized`, `createStorageObjectStore`, `toPendingMultipartResume`, `PendingMultipartResume`, `FindPendingMultipartInput`, `ListByScopeInput`, `ScopeUsage`, `ScopeResolver`, `createObjectAccessGuard`, `createQuotaGuard`, `purgeStalePendingObjects`, and their option types. React's resume record now stores the upload ticket, so the multipart resume helpers are gone. `DbClientGetObjectInput`, `DbClientListObjectsInput`, and `DbClientListObjectsResponse` are exported from `@dimah-s3/db/client` only.\n- **New root exports:** `DB_SCHEMA_VERSION`, `migrate`, `DbAttributesOptions`, `DbQuotaOption`, `DbRouteOptions`, `StorageFolder`, `DbClientFolder`, `DbQuota`, `DbUsage`, `StandardSchemaV1`, `PurgeStaleOptions`, `PruneDeletedOptions`, and the store input and page types. `runCli` from `@dimah-s3/db/cli` takes a `DimahS3DbClient`.\n- **`resolveScope` sees only the caller.** `ScopeContext` is `{ request, locals, session, operation, route? }`. `key`, `folder` (the cached path), `folderId`, and `clientMetadata` are on `AuthorizeContext`. The scope is resolved once per call, operation, and route.\n- **`authorize`** receives the stored row (`StorageObject`, with `scope`, `s3Metadata`, and the stored attributes), not the browser view.\n- **New codes.** An upload to a key that holds an active object, without `replace: \"overwrite\"`, fails with `OBJECT_EXISTS` instead of `CONFLICT`. Creating an existing folder fails with `FOLDER_EXISTS`. `CONFLICT` stays for purge in progress and lost races.\n- **Ownership errors.** A row of another scope is `OBJECT_NOT_FOUND` (`404`), not `FORBIDDEN`. An upload to a key another scope holds is still `FORBIDDEN`.\n- **`s3.db.objects`** is `DbObjects`: `find`, `list`, `count`, `usage`, and `update`, which takes `folderId` (`FOLDER_INVALID` or `FOLDER_NOT_FOUND`). Uploads do not create folders. The lifecycle methods (`upsertPending`, `markActive`, `cancelUpload`, `discardUpload`, `softDelete`, `hardDelete`, `findStale`, `claimStale`, `deletePurged`, `pruneDeleted`) are internal: use `s3.db.pruneDeleted` and the server delete path. `s3.db.folders` (`DbFolders`) validates every cached path. The `StorageObjectStore`, `StorageFolderStore`, `MarkActiveInput`, and `UpsertPendingInput` exports are replaced by `DbObjects` and `DbFolders`.\n- **Folder depth.** A cached folder path deeper than 32 levels, or longer than 1024 UTF-8 bytes, is `FOLDER_INVALID`.\n- **HTTP.** `GET /db/objects` no longer returns `scope`: the tenant id stays on the server.\n- **Client.** `DbClientRequestInit` is removed: every `api.db` action takes core's `S3RequestOptions`, and per-call `headers` are sent. `DbClientListObjectsInput.folderId` accepts `null` for the root. `route` is `S3RouteName`, and `DbClientObject.status` is `DbClientObjectStatus` (no `purging`).\n- **Purge.** `purgeStale` resolves `PurgeStaleResult` instead of `{ purged }`.\n"
    filename: 2026-10-31-1-8-db.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### One database schema\n\n`@dimah-s3/db` reads schema `2.3.0` only. A database already at `2.3.0` is unchanged.\n\n#### Breaking changes\n\n- **No upgrade from another schema.** `sql/upgrade/` is gone, and `migrate(client)` only creates schema `2.3.0`. Create the tables on a new database with your ORM from the generated schema, or `migrate(client)` on an empty database. A database at any other version, including `1.x` and `2.0.0`, throws. See [Upgrade the database](https://s3.dimah.dev/docs/db/upgrade).\n- **`v2` is no longer exported.** The schema is internal. `DB_SCHEMA_VERSION` is `2.3.0`.\n"
    filename: 2026-11-02-db-single-schema.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Folders are rows with ids\n\nA folder is its id. An object stores `folderId` instead of a path. Renaming or moving a folder rewrites the cached paths under it and leaves every object id as it is. `PATCH /db/folder` renames (`name`) and moves (`parentId`). `createFolder` creates one folder inside a parent that already exists. An upload's `clientMetadata.folderId` must name that folder. The list's first page includes `trail`, from the root down to the open folder.\n\nThe database schema is `2.3.0`. Create it on a new database. A `1.x` database and a `2.0.0` beta database are not upgraded.\n\n#### Breaking changes\n\n- **Schema `2.3.0` replaces every earlier schema.** `storage_object.folder` is now `folder_id`. `storage_folder` stores `parent_id` (`\"\"` is the root), `name`, and a cached `path`, plus `updated_at`. Create the tables from the generated Drizzle or Prisma schema, or with `migrate(client)` on an empty database. A database at any other version throws.\n- **Folder addresses are ids.** `GET /db/objects` takes `folderId` (`\"\"` is the root). `PATCH /db/object` takes `folderId`. `POST /db/folder` takes `{ parentId, name }`. `PATCH /db/folder` takes `{ id, name?, parentId? }`. `DELETE /db/folder` takes `id`. `DbClientObject.folder` is `folderId`. `DbClientFolder` is `{ id, name, parentId, path, createdAt, updatedAt }`.\n- **Uploads no longer create folders.** Set `clientMetadata.folderId` to an existing folder. A missing id is `FOLDER_NOT_FOUND` (`404`). `s3.db.folders.ensure` is removed. `create` takes `{ parentId, name }`, and `update` renames or moves.\n- **`dbObjectSource` parents are folder ids.** Uploads send `clientMetadata.folderId`. The first page's `trail` fills the breadcrumb.\n"
    filename: 2026-11-03-db-folder-ids.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Add columns to the Drizzle tables\n\n`runCli` → `generate` writes the Drizzle tables into your app, so you can add columns to them. Keep the table and column names. A column you add must be nullable or have a default, because the plugin does not read or write it. Generating again overwrites the file.\n"
    filename: 2026-11-03-drizzle-schema-copy.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Rename from the database list\n\n`dbObjectSource` renames a file with `api.db.updateObject` (`name`, same `key` and `bucket`) and a folder with `api.db.updateFolder` (`name`). The stored object key stays. `folders: false` still renames files. A folder name that cannot be one path segment fails with `FOLDER_INVALID` before the request. The methods are set when `api.db` has those actions.\n"
    filename: 2026-11-04-list-rename-db.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Generate the db() schema with the CLI\n\n`@dimah-s3/db` runs on FumaDB 0.7. Its schema declares the indexes, the MySQL index prefix lengths, and the collations, so `runCli` from `@dimah-s3/db/cli` writes complete Drizzle tables and Prisma models, and `migrate` creates complete tables with Kysely, on SQLite, PostgreSQL, and MySQL.\n\n- **`generate` needs no connection.** `runCli(DimahS3Db.client(drizzleAdapter({ db: undefined, provider })))` writes the Drizzle tables, and `prismaAdapter({ prisma: undefined, provider })` the Prisma models. Run it again after you upgrade `@dimah-s3/db`. See [Database Setup](https://s3.dimah.dev/docs/db/setup).\n- **`migrate` works on MySQL.** `migrate(client)` and the CLI's `migrate` command create the same tables and indexes.\n- **Drizzle tables.** The generated file exports `storageObject`, `storageFolder`, `private_dimah_s3_settings`, and `relations`. Pass `relations` to `drizzle()`, or the three tables to your own `defineRelations()`. The tables need no `@paralleldrive/cuid2`.\n- **Column types.** Text columns are `varchar` on every database: `key`, `path`, and `search_name` hold 1024 characters, `status` and `acl` 16, `route` and `upload_token` 64, and the others 255. `upload_id` stays `text`, and so does the settings `value`. Sizes are `bigint`, stored as `integer` on SQLite.\n- **Code that queries the generated tables.** The Drizzle tables read `size` and `declaredSize` as JavaScript `bigint` (`mode: \"bigint\"`), so convert them before `JSON.stringify` or arithmetic with a `number`. `id` has no default: the plugin generates ids, so a row you insert yourself needs one. `s3.db.objects` returns sizes as numbers.\n- **MySQL.** Text columns compare byte for byte (`utf8mb4_bin`). `key` and `path` are indexed on their first 512 characters, and timestamps are `datetime(3)`. Prisma has no collation attribute: add the collations to the generated migration.\n- **Folder conflicts with Drizzle.** Renaming or moving a folder onto a taken name returns `FOLDER_EXISTS` through the Drizzle adapter too, instead of `500` `INTERNAL_ERROR`.\n"
    filename: 2026-11-08-db-generated-schema.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Scopes and folder paths fit the database\n\n`db()` checks the scope and the folder path against the limits of the columns and indexes that hold them, so a value the database would reject fails with a clear error first, the same way on SQLite, PostgreSQL, and MySQL.\n\n- **Scopes.** `resolveScope` returns at most 255 characters, the length of the `scope` columns. A longer scope fails the call as a config error (`500` `INTERNAL_ERROR`, with the length in the server log) before any row is written.\n- **Folder paths.** A cached folder path is at most 1024 UTF-8 bytes, like an S3 key, so the `(scope, path)` unique key stays under PostgreSQL's 2704-byte limit for an index entry. A create, rename, or move past it is `FOLDER_INVALID`.\n- **Unique conflicts.** Folder and upload conflicts are read from FumaDB's `UniqueConstraintError`, on every adapter.\n"
    filename: 2026-11-08-db-scope-path-limits.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### UTC timestamps and PostgreSQL schemas\n\n`@dimah-s3/db` runs on FumaDB 0.7.2.\n\n- **Timestamps are UTC on every adapter.** On PostgreSQL and MySQL, the Kysely adapter writes and reads the timestamp columns in UTC, as Drizzle and Prisma do, whatever the time zone of the process. Instances in different zones agree on deadlines like `expiresAt`.\n- **Tables in a PostgreSQL schema.** Create the client from `DimahS3Db.names.schema(\"storage\")` to keep the tables in the `storage` schema. `migrate` creates it, the generated Drizzle tables declare it with `pgSchema(\"storage\")`, and the generated Prisma models with `@@schema(\"storage\")`. The settings table, `private_dimah_s3_settings`, stays in the search path. See [Database Setup](https://s3.dimah.dev/docs/db/setup).\n"
    filename: 2026-11-08-db-utc-pg-schema.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Search across folders in db()\n\n`GET /db/objects` searches a folder and every folder below it, and search ignores case, accents, and look-alike letters the same way on SQLite, PostgreSQL, and MySQL.\n\n- **`recursive`.** With `folderId`, `api.db.listObjects({ folderId, recursive: true })` lists the objects of that folder and every folder below it, up to 10,000 folders. At the root that is the whole scope. `folders` then holds every folder below that matches `search`, by name. `s3.db.objects.list` and `count` take `recursive` too.\n- **`locations`.** Each page of a recursive listing carries the folders on the way to its rows. Walk `parentId` from a row's `folderId` to draw where it lives.\n- **`total`.** The first page of a search carries the number of objects that match across every page.\n- **Search text.** `search` matches a folded copy of the name, built with `normalizeSearchText` from `@dimah-s3/core`, so `invoice` finds `Invoice.PDF` on PostgreSQL too, and `%`, `_`, and `\\` match as themselves. Folder names match the same way.\n- **`s3.db.folders.descendants(scope, parentId, { search, limit })`** lists the folders below a folder at any depth, and **`s3.db.folders.ancestors(scope, ids)`** every folder on the way to some folders.\n- **`dbObjectSource`** searches below the open folder (`searchScope: \"folder\"`) or the whole scope (`\"all\"`), sets `searchScopes`, and gives each result a `location`. Pass `recursiveSearch: false` to search the open folder only, for an `authorize` that refuses `recursive`.\n- **Folder names with `_`, `%`, or `\\`.** Renaming or moving a folder finds the folders below it through their parent ids, so such a name no longer misses its own subfolders or rewrites another folder's.\n\n#### Breaking changes\n\n- **Create schema `2.3.0` on a new database.** `storage_object` and `storage_folder` gain a required `search_name` column. A database at an earlier version is not upgraded: regenerate the Drizzle or Prisma schema with `runCli`, or call `migrate(client)` on an empty database.\n- **Search results change.** `search` is no longer a `LIKE` on the file name: case and accents do not count on any database, and `%` and `_` are no longer wildcards.\n- **Check `recursive` in `authorize`.** A `list` call with `recursive: true` returns the objects of every folder below `folder`. An `authorize` that allows a folder and denies a folder inside it must now deny a recursive listing of the outer one, or that listing shows the inner folder's objects. Return `false` for `recursive` to keep listings to one folder, and pass `dbObjectSource(api.db, { recursiveSearch: false })` so the list searches the open folder only.\n"
    filename: 2026-11-15-search-folders-db.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Record an object already in the bucket\n\n`s3.db.record` writes an active row for an object the app already put in the bucket: a copy, an import, or a file another system wrote. It does not copy or delete the bytes.\n\n- **Checks.** Every instance guard, then the route guard, runs first, with `operation: \"plugin\"` and `plugin: { id: \"db\", action: \"record\" }`. `resolveScope` and `authorize` then run with `operation: \"record\"`. The key must sit inside the route namespace (`KEY_INVALID`). The size, type, and eTag come from HeadObject. The route's `fileTypes` and `maxFileSize` apply. An empty object is `FILE_EMPTY`.\n- **Quota.** An object that does not fit is refused, and no row is written. The object stays in the bucket.\n- **Rows.** A second call for the same bytes returns the row. A different object at the key is `OBJECT_EXISTS`. A row an upload or purge holds is `CONFLICT`. A deleted row is replaced. A `folderId` must exist (`FOLDER_NOT_FOUND`). `null` and `\"\"` are the root. `name` defaults to the last segment of the key.\n- **Call.** Pass `{ headers }`, `{ request }`, or `{ locals }` the way you call `s3.api`. `locals` seeds the guards. Every failure is an `APIError`, as from `s3.api`.\n\n#### Breaking changes\n\n- **Handle `operation: \"record\"` in `resolveScope` and `authorize`.** They receive it from `s3.db.record`. A switch that lists every scope operation needs a `record` case.\n"
    filename: 2026-11-19-db-record-object.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Schema 2.3.0 and a folder-aware authorize\n\n`db()` reads schema `2.3.0`, `authorize` sees the folder a stored object is in, and the stores take the scope as their first argument.\n\n- **`authorize` sees where the target is.** `folder` and `folderId` are set for download, delete, read, confirm, and the multipart calls too, read from the object's row. A rule on `folder` now covers every way to reach an object. The folder is read only when `authorize` is configured.\n- **`destination`.** A move of an object, a rename or move of a folder, and `POST /db/folder` pass `destination: { folder, folderId }`: where the call puts the target.\n- **A refused upload leaves no row.** When confirm, multipart complete, or `s3.put` refuses an upload and the server deletes its object, the plugin removes that upload's row through `upload.onRejected`, including an active row the upload was overwriting.\n- **Name sort.** `sort: { field: \"name\" }` orders by the folded name that search matches, so case and accents do not count on SQLite, PostgreSQL, and MySQL alike. `s3.db.folders.children` and `descendants` list folders in that order.\n- **`maxFolders`.** A `quota` can cap the folders of a scope. `POST /db/folder` past the cap is `QUOTA_EXCEEDED` with `limit: \"folders\"`. `s3.db.folders.count(scope)` returns the number.\n- **A file-only quota counts rows.** With `maxFiles` and no `maxBytes`, the quota check is one `COUNT`.\n- **Folder moves hold under concurrency.** A subfolder created while its parent is renamed gets its new path, a parent deleted during a create or a move is put back, and two moves that would put each folder inside the other end with one undone and `CONFLICT`.\n- **The schema check reads the tables.** `checkSchema` and the first query also read one row of each table, so a database the generated schema was never applied to fails there, with what to run.\n- **`DB_FOLDER_ID_KEY`.** `@dimah-s3/db` and `@dimah-s3/db/client` export the `clientMetadata` key an upload names its folder with (`\"folderId\"`).\n- **`dbObjectSource`.** `usage: true` asks for the usage line without a quota, and `limit` is clamped to 1 to 100.\n- **`s3.db.record` names.** A name follows the rule of an uploaded file name, and the default name from the key is fitted to it.\n\n#### Breaking changes\n\n- **Create schema `2.3.0` on a new database.** `storage_object.filename` is `name`, and `e_tag` is `etag`. `route` is `varchar(64)` and `acl` is `varchar(16)`. `storage_object_scope_filename_idx` is `storage_object_scope_name_idx` on `(scope, status, search_name)`, and the unique `storage_folder_scope_path_uk` is the plain index `storage_folder_scope_path_idx`. On MySQL, `name` uses `utf8mb4_bin` like every other text column. Generate the Drizzle or Prisma schema again with `runCli`, or call `migrate(client)` on an empty database. A database at another version throws.\n- **`filename` is `name`.** Read `StorageObject.name` and `DbClientObject.name`. Send `name` in `PATCH /db/object`, `api.db.updateObject({ name })`, and `s3.db.objects.update(ref, { name })`. The sort field is `\"name\"`.\n- **`authorize`: `folder` and `folderId` are where the target is now.** A move of an object and a rename or move of a folder report the new place in `destination`, not in `folder`. `POST /db/folder` reports the parent in `folder` and the new path in `destination.folder`. Read `destination?.folder` where a rule read `folder` for those calls.\n- **A flat listing asks `authorize` for the whole scope.** `GET /db/objects` without `folderId` passes `folder: null`, `folderId: null`, and `recursive: true`. A rule that returns `false` for `recursive` now refuses it: list with a `folderId`, or allow `recursive` at the root.\n- **Folder operations have their own names.** `resolveScope`, `authorize`, and a `quota` function receive `\"folder.create\"` for `POST /db/folder`, `\"folder.update\"` for `PATCH /db/folder`, and `\"folder.delete\"` for `DELETE /db/folder`. `\"update\"` is `PATCH /db/object` only.\n- **The stores take the scope first.**\n  - `s3.db.objects.list({ scope, ...filter })` → `s3.db.objects.list(scope, filter)`.\n  - `s3.db.objects.count({ scope, ...filter })` → `s3.db.objects.count(scope, filter)`.\n  - `s3.db.objects.getUsage(scope)` → `s3.db.objects.usage(scope)`.\n  - `ObjectFilter` and `ListObjectsInput` have no `scope`.\n- **`s3.db.folders.retain` is removed.** The plugin puts a folder back itself after it writes into one.\n- **Ask for `usage` when there is no quota.** `GET /db/objects` sends `usage` on the first page when the plugin sets a `quota`, or when the query has `usage=true`. Pass `dbObjectSource(api.db, { usage: true })` or `api.db.listObjects({ usage: true })` to keep the usage line without a quota.\n- **`DimahS3DB` is `DimahS3Db`.**\n- **Import `migrate` from `@dimah-s3/db`.** `@dimah-s3/db/cli` exports `runCli` only.\n- **Client types name the object.** `DbClientGetInput` → `DbClientGetObjectInput`, `DbClientUpdateInput` → `DbClientUpdateObjectInput`, `DbClientListInput` → `DbClientListObjectsInput`, and `DbClientListResponse` → `DbClientListObjectsResponse`.\n- **`@dimah-s3/db/client` does not export `StorageObjectStatus`.** Use `DbClientObjectStatus`, which `@dimah-s3/db` exports too. `StorageObjectStatus` stays on `@dimah-s3/db`.\n- **A scope cannot be empty or have whitespace at either end.** `resolveScope` returning one fails the call with `500 INTERNAL_ERROR` and logs the reason.\n- **A folder name cannot start or end with whitespace.** It is `FOLDER_INVALID`.\n- **`s3.db.record` checks `name` like an upload.** It is 1 to 255 UTF-8 bytes with no control or bidi characters, and may contain `/`. A name of up to 255 characters that is longer than 255 bytes is now a `VALIDATION_ERROR`.\n"
    filename: 2026-11-20-db-final-beta.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n  \"@dimah-s3/ui\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/ui)\n---\n\n### Folder rows show what they hold\n\nA folder row shows how many files it holds and how large it is, on the same line a file uses for its size and date.\n\n- **The whole folder.** The count and the bytes include that folder and every folder below it. An empty folder is `0`. `memoryObjectSource` measures the records it holds. `GET /db/objects` sends `size` and `objectCount` on each folder of the page. The list's `usage` stays the whole scope.\n- **`db.objects.usage(scope)`.** Still sums the scope. Pass `{ folderId, recursive: true }` to sum one folder yourself.\n- **`ObjectListFolder`.** `size` and `objectCount` are optional. Leave them out when a source does not know, and the line stays empty.\n- **Your own second line.** `renderDescription` still replaces it.\n"
    filename: 2026-11-21-folder-row-totals.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### db() on the plugin SDK\n\n`db()` reads the resolved routes and runs `s3.db.record` through the plugin SDK, so every guard applies to it.\n\n- **`s3.db.record` runs every guard.** Every plugin's instance guard runs, then the user's instance guard and the route guard. A guard another plugin adds, such as auth or a rate limit, now applies to it.\n- **`s3.db.record` fails with an `APIError`.** An unexpected failure is logged, passed to `onError`, and becomes `500 INTERNAL_ERROR`, as from `s3.api`.\n- **Guards name the db action.** A `/db/*` call carries `plugin: { id: \"db\", action }`, where `action` is the `dbClient()` method: `listObjects`, `getObject`, `updateObject`, `createFolder`, `updateFolder`, or `deleteFolder`.\n- **`dbClient()` is typed by `db()`.** Its responses come from the endpoint types, so the client and the server stay in step.\n\n#### Breaking changes\n\n- **Compare `plugin.action` in guards.** The instance and route guards no longer receive `operation: \"record\"` from `s3.db.record`: they receive `operation: \"plugin\"` with `plugin.action === \"record\"`.\n"
    filename: 2026-11-23-db-plugin-sdk.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/db)\n---\n\n### Move and delete folders from dbObjectSource\n\n`dbObjectSource` moves files and folders and deletes folders with everything in them, through the endpoints `db()` already has.\n\n- **Move.** `moveFile` sends the new `folderId` to `api.db.updateObject`, and `moveFolder` the new `parentId` to `api.db.updateFolder`. The object key stays. Set when `folders` is on.\n- **Folder delete.** `listFolderKeys` pages through `GET /db/objects` with `recursive` and the source's filters, so the list can delete those objects with `useDelete`. `deleteFolder` then calls `api.db.deleteFolder({ id, recursive: true })`. Set when `folders` is on, and `deleteFolder` when `api.db` has it.\n- **`DELETE /db/folder?recursive=true`.** Removes the folder and the folders below it, deepest first, as long as none of them holds an active or pending object. A folder with one is `FOLDER_NOT_EMPTY`; the empty folders removed before it stay removed. `authorize` sees the folder the call names. `api.db.deleteFolder` takes `recursive`.\n- **`s3.db.folders.delete(scope, id, { recursive })`.** The same on the server.\n"
    filename: 2026-11-23-object-list-move-db.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    type: patch\n---\n\n### Accept labels in linear time\n\n`formatAcceptLabels` from `@dimah-s3/react/engine`, and `useFormatAcceptLabels`, cut a MIME type's `+suffix` without a regular expression, so an `accept` token with a long run of `+` no longer takes quadratic time. The labels do not change.\n"
    filename: 2026-11-23-accept-labels-linear.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Per-key hook state, a per-file upload queue, and a React-free engine\n\nEvery hook keeps its state per key. `useDelete`, `useDownload`, and `useFetchDownload` expose `operations`, `get(key)`, and `pendingKeys`, and a second call for a key that is already running joins that call instead of sending another request. Every action returns an outcome or a result object, so you can `await` it instead of reading state.\n\n- **Upload queue.** `useUpload` uploads each file on its own. `cancel(id)` cancels one file, `append: true` adds new files instead of replacing the queue, and an invalid file no longer stops the rest of the batch. Multipart parts go through a worker pool that follows the server's layout, and each part is hashed as a stream.\n- **`useFetchDownload`** is the fetch-to-blob download, split out of `useDownload`. `useDownload` hands the URL to the browser.\n- **`getDropTargetProps`** turns any element into a drop target without making it a click-to-open dropzone, for folder rows and list frames.\n- **`@dimah-s3/react/engine`** holds the plain functions: `uploadFile`, `uploadAbortReason`, `getUploadAbortKind`, `multipartResumeKey`, `mergeUploadRequest`, `DEFAULT_MULTIPART_THRESHOLD`, `createLocalStorageUploadStore`, `createMemoryUploadStore`, `defineApi`, `memoryObjectSource`, `readObjectListLevel`, `objectListEntryKey`, `objectKeyOf`, `loadRouteCatalog`, `resolveRouteUploadPolicy`, `mergeRouteUploadPolicy`, `formatFileSize`, `formatAcceptLabels`, `truncateFileName`, and `toTimestamp`. It has no `\"use client\"` directive and no React import, so it works in shared and server modules. `formatFileSize` and `truncateFileName` moved here from `@dimah-s3/core`.\n- **Retry a failed upload.** `useUpload` gains `retry(id?)`: it sends the failed file `id` again, or every failed file. A retried file keeps its place and `id` and goes back to `queued`, with the call options it was first sent with, so it lands in the same folder. It is validated again, `beforeUpload` and `onUploadStart` run again, and a retry never replaces the queue. It resolves like `handleFiles`. With an `uploadStore`, a multipart upload that failed on a retryable error resumes from the parts S3 already has.\n- **Accept labels.** `useFormatAcceptLabels()` returns the labels for `accept` tokens with translated group labels (`\"Images(file type group)\"`, `\"Videos(file type group)\"`, …), and `formatAcceptLabels(accept, { groups })` takes your own. Long and prefixed MIME types read as their file type (`DOCX`, `SVG`, `TAR`), and the result keeps the order of `accept`.\n- **`mergeUploadRequest(base, override)`** combines two request objects the way a call's `uploadOptions` go over the hook's: `override` fields win, and `clientMetadata` merges key by key.\n- `UseUploadOptions.accept` takes a readonly array, so an `as const` list type-checks.\n- **Object lists.** `ObjectListUsageData` gains `maxBytes` and `maxFiles`. A source may provide `uploadOptions(parent)` and `createFolder({ parent, name })`, and `useObjectList` returns both. `parent` is a folder id, and `null` is the root. `memoryObjectSource({ limits })` reports limits with usage.\n- **`useObjectUrl`** returns `expiresAt` and `objectKey`, refreshes the URL before it expires, and shares one cache per `S3Api`. When a background refresh fails, the URL stays while it still works and `error` is set; a transient failure (408, 429, or 5xx) is retried with backoff until the URL expires.\n- **`useUpload({ disabled })`** makes `open()` a no-op, and the return gains a `disabled` field. `handleFiles` still uploads what it is given.\n- **Without `append`.** A call that is blocked, rejected, or fails before uploading no longer cancels running uploads, and a new call cancels older calls that are still preparing.\n- **Upload names.** The engine fits `name` (from `fileName` or `file.name`) to the 255-byte wire rule with `fitFileName` before presign and multipart init, so a long or odd name uploads under a shortened name instead of failing with `VALIDATION_ERROR`.\n- **Uploads and resume.** The browser transport raises `CHECKSUM_MISMATCH` when S3 rejects a checksummed PUT or part (`BadDigest` or `XAmzContentChecksumMismatch`); a custom `UploadTransport` should do the same. With an `uploadStore`, a multipart failure that retrying cannot fix aborts the server upload and deletes the record; only retryable errors, `pause()`, and `detach()` keep it.\n- **`useFetchDownload`** reports progress at most every 100 ms, ignores `content-length` and `fileSize` for an encoded body, and never reports more than 100 percent. A failure while reading the body becomes `NETWORK_ERROR`.\n- **`removeMany`** reports results under the keys you passed, even when the server normalizes them, and never leaves an operation stuck in `deleting`. A key is never trimmed to match an answer, so a key with whitespace around it fails as `KEY_INVALID` under the key you passed.\n- The unused runtime dependency `immer` is dropped.\n\n- **New error copy.** `useFormatError` words `OBJECT_EXISTS`, `FOLDER_EXISTS`, and `FEATURE_DISABLED` with `feature: \"proxy\"`, and still reads a raw better-call error by rebuilding it first. `CONFLICT`, which now means a concurrent change won, reads \"Another change happened at the same time. Try again.\" in place of \"Conflict\"; rename that key in your translations.\n\n#### Breaking changes\n\n- **Entries and peers.**\n  - Nothing from `@dimah-s3/core` is re-exported. Install `@dimah-s3/core` and import `APIError`, `S3_ERROR_CODES`, `isS3ErrorCode`, `validateFile`, `S3Api`, and the other protocol names from it.\n  - Plain functions moved to `@dimah-s3/react/engine` (list above). `uploadFiles`, `FileItem`, `FileItemStatus`, `MultiUploadCallbacks`, and `UploadEngineCallbacks` are removed.\n  - The root entry holds hooks, `S3Provider`, `useS3Api`, `createS3Client`, the `useFormat*` hooks, and types. Its `dist/index.js` starts with `\"use client\"`.\n  - The React peer is now `react >=19.2`, the version `@fuma-translate/react` needs. `@fuma-translate/react` is a peer dependency only; install it next to `@dimah-s3/react`.\n  - `formatFileSize`, `truncateFileName`, `FileSizeUnit`, and `FormatFileSizeOptions` come from `@dimah-s3/react/engine`, not `@dimah-s3/core`.\n- **`useDelete`.**\n  - State is per key: `operations`, `get(key)`, `pendingKeys`, and `isPending`.\n  - The confirm slot moved to the ui `Delete` component. `requestDelete`, `confirmDelete`, `cancelDelete`, and `isConfirming` are removed.\n  - `remove(key)` returns an outcome. `removeMany(items)` takes any number of keys, sends them in chunks of `DELETE_MANY_MAX_KEYS`, and returns `{ deleted, failed: { key, error }[], blocked }`.\n  - Callbacks are `onSuccess(data, key)`, `onError(error, key)`, and `onSettled(result)`. `data` is `DeleteData`, `{ key, bucket? }`; `bucket` is set by `remove` only. A delete outcome never has status `aborted`.\n  - `reset()` no longer cancels a delete that is in flight.\n- **Downloads.**\n  - `useDownload({ mode: \"fetch\" })` is now `useFetchDownload()`. `isFetchDownload` is removed; narrow on `.kind`.\n  - `onInitiated` is now `onSuccess`, and `onCancel` is removed: a cancelled call settles with an `aborted` outcome.\n  - `download(key, { fileName })` returns an outcome. `presign(key, { fileName, expiresIn })` returns one too and runs `beforeDownload`.\n  - Keys run in parallel, and a repeated key joins the running call.\n- **Uploads.**\n  - `files[].status` is now `phase`. `isUploading` is removed; use `isPending`.\n  - `UseUploadReturn` gains the required fields `disabled` and `retry`. Stubs that build a full return must add `disabled: false` and a `retry` function.\n  - `handleFiles(files, { uploadOptions, maxFiles })` resolves `{ uploaded, failed, rejected, blocked, aborted }`. Call `uploadOptions` merge over the hook's, and `clientMetadata` merges key by key.\n  - Callbacks run per file: `onSuccess(result, file)`, `onError(error, file)`, and `onProgress(progress, file)`, plus `onSettled(result)` once per call, even when every file was rejected. `onFileSuccess`, `onFileError`, `onFileProgress`, and `onCancel` are removed.\n  - `getUploadOptions` is merged into `uploadOptions`, which can be a function of the file.\n  - The `checksum` options and `multipartPartSize` are removed: the server's route catalog decides. `uploadStore: false` is removed.\n  - Unmount detaches resumable uploads and cancels the rest. 1.x resume records are ignored.\n  - `UploadResult` uses `name`, `size`, and `type`. `StoredUpload` uses `fileSize` and stores the upload ticket.\n- **Errors.**\n  - `S3UploadError` is removed. Every error is an `APIError` with a catalog code.\n  - An aborted upload rejects with an `AbortError` `DOMException`. Use `getUploadAbortKind` from `@dimah-s3/react/engine` to tell cancel from detach.\n  - `FileRejection.errors` is `APIError[]`. `useFormatValidateFileError` is removed; use `useFormatError`.\n  - `formatEta` is now the hook `useFormatEta`. `UploadProgress` and `FetchDownloadProgress` are now `TransferProgress`.\n- **`useObjectUrl`.** `expiresIn` on the return is replaced by `expiresAt`, an absolute timestamp in milliseconds, or `null` for proxy URLs. A URL with a short lifetime refreshes at half of it.\n- **Engine.** `uploadFile(api, file, { route, policy, ... })` takes one options object. `UploadTransport` receives `TransferProgress`.\n- **Removed types.**\n  - `UseNavigateDownloadOptions` and `UseNavigateDownloadReturn` are now `UseDownloadOptions` and `UseDownloadReturn`.\n  - `UseDeleteState`, `UseFetchDownloadState`, `DeleteHooks`, `DownloadHooks`, `FetchDownloadHooks`, `UploadHooks`, `DeletePhase`, `DownloadPhase`, and `FetchDownloadPhase` are removed. Per-key state is `DeleteOperation`, `DownloadOperation`, and `FetchDownloadOperation`, and actions return `DeleteOutcome`, `DownloadOutcome`, and `FetchDownloadOutcome`.\n  - `FileUploadConfig` is removed. Use `UseUploadOptions` for the hook and `UploadFileOptions` for `uploadFile`.\n- **Translations.** Many UI string keys changed. `satisfies Partial<Translations>` flags the keys that no longer exist.\n- **Translations.** New keys: \"A file with this name already exists\", \"A folder with this name already exists\", and \"Streaming downloads are disabled\" (note `API error`); \"Images\", \"Videos\", \"Audio\", \"Text files\", and \"Fonts\" (note `file type group`); and for the ui retry actions \"Retry {name}\" (`attachment action`), \"Retry failed uploads\" (`upload control`), and \"Retry\" (`toast action`).\n- **`formatAcceptLabels`.** `audio/*` is now `Audio` (was `Audios`), `text/*` is `Text files` (was `Texts`), another group reads like `Model files` for `model/*`, and `*` or `*/*` has no label. A MIME type's label drops `x-`, `vnd.`, and a `+suffix`, and known office and archive types read as their extension (`DOCX`, `ZIP`).\n"
    filename: 2026-10-31-1-8-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Breadcrumb from the list page\n\nWhen the first page of `useObjectList` includes `trail`, the hook shows those folder names. A source that omits `trail` keeps the trail built while navigating. `dbObjectSource` sends the trail, so a deep link opens with the real names.\n"
    filename: 2026-11-03-list-trail.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Rename a listed file or folder\n\n`useObjectList` renames through the source. `renameFile({ item, name })` and `renameFolder({ folder, name })` turn on `list.renameFile(item, name)` and `list.renameFolder(folder, name)`. Return the updated row and the list shows it. Leave the return out and the list reloads. A sort on `name`, or a search, reloads either way. An unchanged name does not call the source.\n"
    filename: 2026-11-04-list-rename-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### List entries stay put between renders\n\n`useObjectList` keeps each entry object while its item or folder is the same object, so `entries`, and the selection maps built from them, keep their identity when a component renders again. An inline source no longer rebuilds them on every render.\n\n#### Breaking changes\n\n- **Keep `getId` and `getFile` pure.** They run once per item object. A `getFile` that reads other state shows the old value until the item changes: replace the item with `setItems`, or reload.\n"
    filename: 2026-11-06-object-list-stable-entries.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Per-call append, and list state that follows the rows\n\nAn upload call can choose to append or replace, the object-list hooks keep their state in step with the rows on screen, and the formatter and type names line up with the rest of the API.\n\n- **`handleFiles(files, { append })`** overrides the hook's `append` for one call: `true` adds the files and leaves the files in flight alone, `false` replaces the queue. `UploadCallOptions` gains `append`.\n- **Selection follows the rows.** Without `persist`, `useObjectListSelection` drops an entry that a reload or search no longer returns, so it does not come back selected when it shows again.\n- **Search resets with the folder.** A controlled `parent` that changes from outside, such as on browser back, clears the search the way `openFolder` does, and the old search never loads in the new folder.\n- **`createFolder` reloads under a name sort or a search**, as a rename does, so the new folder shows where the source puts it.\n- **Engine types.** `@dimah-s3/react/engine` exports the types its functions take and return: `UploadRequestOptions`, `UploadEnginePhase`, `UploadResult`, `TransferProgress`, `ObjectListSource`, `ObjectListFile`, `ObjectListFolder`, `ObjectListPage`, `ObjectListQuery`, `ObjectListQueryInput`, `ObjectListSort`, and `ObjectListUsageData`.\n- **Named option types.** `FetchDownloadOptions` types `useFetchDownload().download(key, options)`, and `DeleteOptions` types `useDelete().remove(key, options)`.\n\n#### Breaking changes\n\n- **Rename `useFormatDimahError` to `useFormatError`.** It works the same, and its name now matches the other `useFormat*` hooks.\n- **Rename the `ObjectListUsage` type to `ObjectListUsageData`.** The old name clashed with the `ObjectListUsage` component from `@dimah-s3/ui`.\n- **`useDownload` drops `presignMany`** and the `PresignManyResult` type. Call `presign(key)` for each key, or use `useObjectUrl` for previews, which caches and refreshes each URL.\n- **`@dimah-s3/react/engine` drops `formatSpeed` and `formatUploadProgress`.** Use `useFormatSpeed()` and `useFormatFileSize()`, which follow the `S3Provider` locale and translations.\n"
    filename: 2026-11-06-react-hooks-cleanup.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Upload limits across calls\n\n`useUploadLimit` caps the files one `useUpload` takes in across its calls, and `retry` takes several ids at once.\n\n- **`useUploadLimit(upload, { available, counted })`** caps every call of the hook while the calling component is mounted: `handleFiles`, `open`, drops, pastes, and `retry`, wherever they come from. A call holds its slots from the moment it starts, so two quick calls never take the same ones. The hook rejects the files past the limit with `TOO_MANY_FILES`, and a retry sends only the failed files that fit. It returns the files that still fit, counting calls still preparing. The `UploadLimit` type names its argument.\n- **`retry(ids)`** takes one id or several. Failed files that came from one call go again as one call, so `beforeUpload`, `onUploadStart`, and `onSettled` run once for them.\n\n#### Breaking changes\n\n- **Accept an array in a `retry` stub.** `UseUploadReturn[\"retry\"]` now takes `string | readonly string[]`, so a test stub that implements `retry(id?: string)` must take `ids?: string | readonly string[]`.\n"
    filename: 2026-11-06-upload-limit-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Search scope and result locations in useObjectList\n\n`useObjectList` can search the open folder and the folders below it, or everywhere, and keeps where each result lives.\n\n- **`searchScope`.** `\"folder\"` (the default) looks in the open folder and every folder below it, `\"all\"` everywhere. Control it with `searchScope` / `onSearchScopeChange`, or start with `defaultSearchScope`. The query receives it, and changing it reloads only while something is searched. A source lists the scopes it understands in `searchScopes`.\n- **`location`.** A folder or file of a search can carry `location`, the folders from the root down to the one that holds it. Entries copy it, and `openFolder` on a folder with a `location` opens its whole path.\n- **`total`.** A first page can send `total`, the files that match across every page. The hook returns it while searching.\n- **New on the return:** `isSearching`, `searchScope`, `setSearchScope`, `searchScopes`, and `total`.\n- **`memoryObjectSource`** with `getFolder` searches below the open folder or every record, returns the matching folders with their `location`, sends `total`, and adds each record's `location` to `getFile`. It matches with `matchesSearchText` from `@dimah-s3/core`, so look-alike letters and Persian digits match too.\n\n#### Breaking changes\n\n- **`ObjectListQueryInput` has `searchScope`.** Pass it when you call a source's `query` yourself.\n- **`memoryObjectSource` searches below the open folder.** A search used to match the open folder only. To keep that, write your own `query` over `readObjectListLevel`.\n"
    filename: 2026-11-15-search-folders-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Retries that keep the upload, and names that match the server\n\nUploads recover from a failing gateway or server hook instead of starting over, and the hooks use the same words as the server and the engine.\n\n- **Retries follow the server.** A request is sent again after a network error, an S3 `5xx`, `408`, or `429`, and any API response with `5xx`, `408`, or `429`, which includes `INTERNAL_ERROR` from a gateway or from a server hook that failed. Confirm and multipart complete are retried, and with an `uploadStore` a multipart upload that fails this way stays stored and resumes. `HOOK_FAILED` is never retried. `useObjectUrl` follows the same rule.\n- **Uploads work on plain-HTTP origins.** File ids no longer come from `crypto.randomUUID`, which a phone on `http://192.168.…` does not have.\n- **`handleFiles` reports rejected files.** `UploadBatchResult` gains `rejected`: the files a call refused for their type, size, or count, with their errors.\n- **`cancel(ids)` and `reset(ids)`** take one id or several. `reset(ids)` removes only those settled files and keeps the rejections.\n- **`retry()` keeps calls apart.** Failed files of separate calls go again as separate calls, also when the calls shared one options object.\n- **`useDelete` callbacks are current.** `onSuccess`, `onError`, and `onSettled` run from the newest render, as in the other hooks.\n- **Types.** `UploadCallInput`, `UploadRootProps`, and `UploadInputProps` are exported, and `onError` may return a promise in every hook.\n\n#### Breaking changes\n\n- **`@dimah-s3/core` is a peer dependency.** Install it at the same version as `@dimah-s3/react`.\n- **`uploadOptions.metadata` is `uploadOptions.clientMetadata`**, the name the server hooks use. `UploadResult.metadata` is still the object's S3 user metadata.\n- **`queue` is `append`** on `useUpload` and on a `handleFiles` call.\n- **`useApi` is `useS3Api`.** The bound `s3Client.useApi()` keeps its name.\n- **Download hooks: `mode` is `kind`.** `useDownload().kind` is `\"navigate\"` and `useFetchDownload().kind` is `\"fetch\"`. A download result still has `mode`, which is `\"presign\"` or `\"proxy\"`.\n- **`useFetchDownload`.** The `disposition` option is removed, since the bytes are always saved, and `FetchDownloadResult.size` is `fileSize`.\n- **Object lists.** The source's `getKey` is `getId`, and `removeItems` takes those ids.\n- **Upload stores.** `createMemoryStore` is `createMemoryUploadStore`, and `createLocalStorageStore` is `createLocalStorageUploadStore`.\n- **`retry.baseDelay` is `retry.baseDelayMs`.**\n- **`onPartUpload`** receives `{ partNumber, partCount }`: `totalParts` is `partCount`.\n- **`DropzoneRootProps` and `DropzoneInputProps`** are `UploadRootProps` and `UploadInputProps`.\n- **File ids are not UUIDs.** `UploadFileState.id` is an opaque string. Do not parse it.\n- **`UNKNOWN_ROUTE` is `ROUTE_NOT_FOUND`.**\n- **Browsers from Baseline 2024.** The hooks use `Promise.withResolvers` and `AbortSignal.any`: Chrome 119, Firefox 124, Safari 17.4, or newer.\n"
    filename: 2026-11-20-react-retries-and-names.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Move entries and delete folders with useObjectList\n\nA source can move files and folders and delete folders, and `useObjectList` runs those actions on the loaded rows. `uploadOptions` can wait for work such as creating a folder.\n\n- **`moveFile` and `moveFolder` on the source.** Each takes the entry and the destination `parent` (`null` is the root). The object key stays as you store it.\n- **`list.moveEntries(entries, parent)`.** Moves through the source one entry at a time, drops the moved rows, and reloads once. It never rejects and resolves with `ObjectListMoveResult`: `moved`, and `failed` with each `APIError`. Entries already in `parent` are left alone, and a folder moved into itself fails with `FOLDER_INVALID`. Set when the source has `moveFile` or `moveFolder`.\n- **`list.canMove(entry)`.** Whether the source can move that entry. Pass `\"file\"` or `\"folder\"` to ask about a kind.\n- **`listFolderKeys` and `deleteFolder` on the source.** `listFolderKeys({ folder, signal })` returns the object keys in a folder and every folder below it. `deleteFolder({ folder })` removes the folder and the folders below it once their files are gone. The list returns both: `list.deleteFolder(folder)` drops the folder row, and opens the folder that held it when it was open.\n- **`list.listFolders(parent)`.** The folders inside any folder, from the source's first page there, for a folder picker.\n- **`list.createFolder(name, { parent })`.** Creates the folder in another folder. Only a folder created in the open one joins the loaded rows.\n- **`memoryObjectSource` names folder keys.** With `getFolder`, it returns `listFolderKeys`.\n- **Folders join the selection.** `useObjectListSelection` selects files, and folders too when the list can delete or move them. Pass `isSelectable` to choose yourself.\n- **`uploadOptions` may return a promise.** A function in `uploadOptions` runs as each file starts. The file stays `preparing` until the promise settles, and cancelling it stops the wait.\n\n#### Breaking changes\n\n- **Match the code of an `APIError` that `uploadOptions` throws.** The file fails with that error. Any other throw or rejection still fails it with `HOOK_FAILED`.\n"
    filename: 2026-11-23-object-list-move-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Word plugin error codes\n\n- **`formatError` on `S3Provider`.** Your message for an API error (`S3ErrorFormatter`). `useFormatError` and every UI toast ask it first, for plugin codes and catalog codes alike, and `undefined` keeps the built-in message. Without it, a plugin's code shows the English message the server sent.\n"
    filename: 2026-11-23-plugin-error-messages-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Hook results keep their identity\n\nThe objects that `useUpload`, `useDownload`, `useFetchDownload`, `useDelete`, `useObjectUrl`, `useObjectList`, `useObjectListSelection`, and `useRouteUploadPolicy` return stay the same object until a value in them changes, so they can go in effect dependencies and context values.\n\n- **`upload.policy`** stays the same object while the route policy is the same, also when `accept` is a new array on every render.\n- **`upload.getRootProps`, `getInputProps`, and `getDropTargetProps`** keep their identity while the policy and the hook options do.\n- **`useObjectList`** keeps its result while the source functions you pass keep theirs.\n"
    filename: 2026-11-23-stable-hook-results.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/react)\n---\n\n### Pause and resume uploads\n\n`useUpload` pauses files and resumes them where they stopped. A multipart upload continues from the parts S3 already has, with or without an `uploadStore`, while the page stays open.\n\n- **`upload.pause(ids?)`.** Stops one file, several, or every file, including the files of a call still preparing. A paused file stays in the queue with its progress, as phase `\"paused\"`, and frees its upload slot. A file that is `\"finalizing\"` finishes instead.\n- **`upload.resume(ids?)`.** Queues paused files again. A multipart upload continues from its uploaded parts; a single-shot upload starts over. The request options resolved before the pause are sent again, so an `uploadOptions` function does not run twice.\n- **A paused file has not ended.** The `handleFiles` promise, `onSuccess`, `onError`, and `onSettled` wait until it is resumed and finishes, or is cancelled.\n- **Without an `uploadStore`.** The hook keeps the multipart session of a paused file for the page session. A cancel, a failure, `detach()`, or an unmount aborts it, as before.\n- **`reset()` keeps paused files.** It removes only files that uploaded or failed. `cancel()` removes a paused file and aborts its multipart upload; `detach()` and an unmount remove it and keep its record in an `uploadStore`.\n\n#### Breaking changes\n\n- **Handle `\"paused\"` in `UploadFilePhase` and `UploadPhase`.** A file is `\"paused\"` between `pause` and `resume`. The queue is `\"paused\"` while a file is paused and none is in flight; `isPending` is then `false`. A `switch` that lists every phase needs the new case.\n"
    filename: 2026-11-23-upload-pause-react.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/server\":\n    replay:\n      - exit-prerelease(npm:@dimah-s3/server)\n---\n\n### Signed upload tickets, a hardened `/file`, and one error boundary\n\nPresign and multipart init return an HMAC-signed upload ticket. Confirm and every later multipart call verify it, so a client can only finish the upload the server started. Set `ticketSubject` (or use `db()`) to bind a ticket to the caller, so a leaked ticket is useless to anyone else.\n\n- **Multipart.** The server picks the part layout from the declared size, signs each part with its exact length, and with `checksum` on, checks a SHA-256 for every part. `complete` lists the parts itself and is safe to retry.\n- **`upload.verifyContent`** reads the first bytes after confirm and rejects a file whose bytes do not match its declared type with `FILE_CONTENT_MISMATCH`. An upload without a type is checked against the type its name gives (`x.png` as `image/png`). It turns on `checksum`, so the bytes cannot change after the check.\n- **Safer confirm.** A rejected confirm deletes the object with `If-Match` on the HeadObject ETag, so a newer upload at the same key is kept (a provider without conditional delete gets a plain delete). Confirm and multipart complete report, and pass to `onConfirmed` and `db()`, the ACL that `upload.object()` chose, not the route default. A retried or concurrent multipart complete that gets `NoSuchUpload` finalizes the object.\n- **Presigned POST** pins the object key with an `eq` condition. A key from `upload.object()` that contains `${filename}` returns `KEY_INVALID`, and a generated key turns `${` in the file name into `_{`.\n- **Empty files.** Presign, multipart init, and `s3.put` reject a zero-byte file with `FILE_EMPTY`.\n- **`deleteMany`** gives each key its own `locals`.\n- **`upload.onStart({ kind, uploadToken, uploadId?, url?, urlExpiresAt?, expiresAt })`** runs for presign, multipart init, and `s3.put`. `kind` is `\"presignedPost\"`, `\"presignedPut\"`, `\"multipart\"`, or `\"server\"`.\n- **`/file`** sends `Content-Security-Policy: sandbox`, `X-Content-Type-Options: nosniff`, `Cross-Origin-Resource-Policy`, and `Cache-Control: private, no-cache`. It supports a single `Range`, `ETag`, and `If-None-Match`, `If-Modified-Since`, `If-Match`, `If-Unmodified-Since`, and `If-Range`.\n- **Guards** can return `{ locals }` to pass values to later hooks in the same call. Augment `DimahS3Locals` to type them.\n- **`s3.api`** has the same shape as the browser client and takes `{ headers, request, locals }` as a second argument. `locals` lets trusted server code skip a session lookup.\n- **`s3.put`** accepts a `Blob`, a `ReadableStream`, bytes, or a string, writes `Content-Disposition`, and runs the same hooks as a browser upload.\n- **Node adapters** (`toNodeHandler`, `toExpressHandler`, `toFastifyHandler`) stream request bodies and abort the S3 call when the client disconnects. Pass `{ trustProxy: true }` to honor `X-Forwarded-*`.\n- **New config:** `secret`, `ticketSubject`, `baseURL`, `maxRequestBodySize` (1 MiB by default, counted on the stream for every request with a body), `upload.confirmWindow`, `upload.verifyContent`, `upload.multipart.partSize`, and `upload.multipart.ticketExpiresIn`.\n- **Plugin endpoints** built with `createS3Endpoint` accept `GET`, `POST`, `PUT`, `PATCH`, and `DELETE`. `chainHooks` chains guards that return `{ locals }`.\n\n- **`confirmGuard` sees the verified object.** Its context gains `object` (from HeadObject) and `acl`, so the guard whose rejection deletes the object can check what was really stored. `onConfirmed` gains the declared `file` and the `previousKey` it is about to delete.\n- **Plugin helpers.** `@dimah-s3/server/plugins` exports `readUploadMarker`, `deleteObjectIfMatch`, and `isAwsNotFound`, so a plugin that tracks uploads can remove an object only while it is still the one an upload wrote.\n- **Multipart abort is idempotent,** like delete: an upload that is already gone succeeds and runs `onAbort`. One that was completed fails with `CONFLICT`. The response gains `bucket`.\n- **`onError`** may be async, and its context gains `operation`. A rejection from it is logged instead of crashing the process.\n- **`s3.api` and `s3.put`** take a `signal`, like the browser options.\n- **`/file`** forwards `Content-Encoding` and `Content-Language`, so a gzip object decodes in the browser.\n- **Express** mounts work: `app.use(\"/api/s3\", toExpressHandler(s3))` reads `req.originalUrl`.\n- **Fixes.** A plugin `onConfirmed` that fails for a non-4xx reason, such as a database outage, keeps the uploaded object for the retry instead of deleting it. Confirm reports the `kind` the URL was signed with, carried in the ticket, not the route's current `upload.method`. `NoSuchBucket` is a logged `500`, not `404 OBJECT_NOT_FOUND`. More socket errors are `S3_NETWORK_ERROR`. A backslash in a file name becomes `_` in the generated key. An error from another library that is merely named `APIError` is reported as an unexpected failure, not passed to the client.\n\n#### Breaking changes\n\n- **A secret is required for uploads.** Set `DIMAH_S3_SECRET` (`openssl rand -base64 32`, at least 32 characters) or pass `dimahS3({ secret })`. Use the same value on every instance, and pass an array to rotate: the first value signs, all of them verify. Without a secret, uploads return `500` unless `NODE_ENV` is `development` or `test`.\n- **`S3Client` checksums.** A client you pass must set `requestChecksumCalculation: \"WHEN_REQUIRED\"`. The SDK default breaks presigned uploads, so the first presign logs the problem and returns `500`.\n- **Upload hooks.**\n  - `upload.onPresigned` and `multipart.onInit` are replaced by `upload.onStart`. `multipart.onList` is removed.\n  - Upload contexts use `file: { name, size, type }`. `onConfirmed` gets the verified `object: { name, size, type, eTag, versionId, lastModified, metadata }` plus `uploadToken`.\n  - `onConfirmed` runs at least once per upload. Dedupe on `uploadToken`. Any throw from your `onConfirmed`, including an `APIError`, returns `500` and keeps the object. Reject content in `confirmGuard` instead; a rejection there deletes the object.\n  - Confirm and complete delete the object only on a 4xx rejection. A network error keeps it so the call can be retried.\n- **Hook contexts.** Every context has `operation` and `locals`. `StoredObjectContext` is now `ObjectContext`. Download contexts gain `mode`, `download.onPresigned` gets `disposition`, and proxy downloads have no `expiresIn`. `delete.onDeleted` has no `existed`. In `upload.object`, `folder` is now `keyFolder`.\n- **Guards** return nothing or `{ locals }`. Any other value, such as `true` or `false`, is a config error: it is logged and the call returns `500`. `ticketSubject` sees locals from the instance and route guards only.\n- **Hook order.** Lifecycle `on*` hooks run plugin hooks first, then yours, the same as guards.\n- **Errors.** A plain `Error` thrown from a hook returns `500 INTERNAL_ERROR` and is logged. Throw `s3Error(\"FORBIDDEN\")` or another catalog code to reject. The `errors` export is removed. `onError` is called as `onError(error, { request })`.\n- **Security defaults.**\n  - Downloads open inline only for raster images, PDF (presign mode only), audio, video, and plain text, unless `download.inlineTypes` is set.\n  - Body endpoints, core and plugin, accept `application/json` only and return `415 UNSUPPORTED_MEDIA_TYPE` otherwise.\n  - A presigned PUT signs every header it returns. Custom transports must send `headers` exactly.\n  - Non-ASCII metadata values are RFC 2047-encoded and decoded on read. User metadata is limited to 2 KB in total.\n- **Route numbers.** `upload.expiresIn`, `upload.confirmWindow`, `upload.maxFileSize`, `upload.multipart.partSize`, `upload.multipart.ticketExpiresIn`, and `download.maxExpiresIn` must be positive integers. A fractional value now throws at `dimahS3()`.\n- **Config.** `upload.replace` is now `plugins: { db: { replace: \"overwrite\" } }` on the route. `download.expiresIn` is now `download.maxExpiresIn`. `upload.method` now defaults to `\"PUT\"`, which every provider supports, including R2; set `method: \"POST\"` to keep presigned POST.\n- **`s3.api`** takes the browser payload plus `{ headers, request, locals }`. The aliases `deleteBatch`, `multipart*`, and `file` are removed. Plugin endpoints are HTTP only and no longer appear on `s3.api`.\n- **`s3.put`** takes `{ route, name, type, body, size?, metadata, clientMetadata }`. `fileName` and `contentType` are now `name` and `type`, and `headers` moved to the second argument.\n- **`/file` URLs** are relative to the API base path unless `baseURL` is set.\n- **Removed exports.**\n  - From `@dimah-s3/server`: `putObject`, `PutObjectInput`, `errors`, `ServerErrors`, `MultipartAliasApi`, `ROUTE_FEATURES`, `ROUTE_OPERATIONS`, and the `Resolved*`, `Opened*`, `Enabled*`, and `Disabled*` types.\n  - `ObjectFile` is removed; use `UploadFile` for upload contexts and `VerifiedObject` for the confirmed object. `RouteFeature` and `RouteOperation` are removed; hook contexts carry `operation: S3Operation`.\n  - `UploadOnPresignedContext`, `MultipartOnInitContext`, and `MultipartOnListContext` are replaced by `UploadOnStartContext`.\n  - `definePlugin`, `createS3Endpoint`, `createS3Middleware`, and `isFeatureOn` are exported from `@dimah-s3/server/plugins` only. `chainHooks` stays in the main entry.\n  - `DimahS3Plugin`, `DimahS3PluginHooks`, `PluginContextMap`, `PluginInitEnv`, and `S3EndpointContext` are exported from `@dimah-s3/server/plugins` only.\n  - `@dimah-s3/server/plugins` no longer re-exports the config and hook-context types (`DimahS3Config`, `DimahS3RouteConfig`, `UploadConfig`, `DownloadConfig`, `DeleteConfig`, `MultipartConfig`, `FeatureToggle`, `GuardContext`, `RouteGuardContext`, `UploadObjectInfo`, and the `Upload*`, `Download*`, `Delete*`, and `Multipart*` contexts) or `chainHooks`. Import them from `@dimah-s3/server`.\n  - From `@dimah-s3/server/plugins`: `applyPlugins`, `AppliedPlugins`, `CoreEndpoints`, `ReservedPluginId`, the `*_HOOK_KEYS` arrays, `RESERVED_PLUGIN_IDS`, and `CORE_ENDPOINT_NAMES`.\n  - The `@dimah-s3/server/api` entry is gone.\n- **Plugins.** `PluginEndpointMap` is removed. Plugins may provide `hooks.ticketSubject`. The pathless `createS3Endpoint(options, handler)` overload is removed.\n- **`/file` serves proxy-mode routes only.** A route with `download.mode: \"presign\"` (the default) returns `404 FEATURE_DISABLED` with `feature: \"proxy\"` there, so the server never streams objects a route did not opt in for.\n- **Plugin `onConfirmed` failures.** Only a rejection (a `4xx` `APIError`) deletes the object. Any other throw keeps it and returns `500`, so the client can retry.\n- **Plugin `init`** must be synchronous. Returning a promise throws at `dimahS3()`.\n- **`download.resolve`** must return `expiresIn` as a positive integer. Anything else is a config error (`500`), not a silent `600`. In proxy mode the resolve and guard contexts have no `expiresIn` key at all.\n- **Upload checks run first.** Presign checks the single-upload cap and a required checksum before `upload.object()` runs, and every upload kind runs `upload.guard` with the final metadata (`s3.put` merges its `metadata` first).\n- **`keyPrefix` overlap** is checked per bucket: routes on different buckets may share a prefix. A `keyPrefix: false` route on a bucket that other routes use logs a warning.\n- **`createS3Endpoint`** throws right away for a core path.\n- **Hook contexts.** `UploadConfirmGuardContext` gains the required `acl` and `object`, and `UploadOnConfirmedContext` the required `file`: code that builds them by hand, such as tests, must add them.\n"
    filename: 2026-10-31-1-8-server.md
