core:changelogs:
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    type: minor\n---\n\n### Record an object already in the bucket\n\n`s3.db.record` writes an active row for an object the app already put in the bucket: a copy, an import, or a file another system wrote. It does not copy or delete the bytes.\n\n- **Checks.** The instance guard and the route guard run first. `resolveScope` and `authorize` then run with `operation: \"record\"`. The key must sit inside the route namespace (`KEY_INVALID`). The size, type, and eTag come from HeadObject. The route's `fileTypes` and `maxFileSize` apply. An empty object is `FILE_EMPTY`.\n- **Quota.** An object that does not fit is refused, and no row is written. The object stays in the bucket.\n- **Rows.** A second call for the same bytes returns the row. A different object at the key is `OBJECT_EXISTS`. A row an upload or purge holds is `CONFLICT`. A deleted row is replaced. A `folderId` must exist (`FOLDER_NOT_FOUND`). `null` and `\"\"` are the root. `name` defaults to the last segment of the key.\n- **Call.** Pass `{ headers }`, `{ request }`, or `{ locals }` the way you call `s3.api`. `locals` seeds the guards.\n\n#### Breaking changes\n\n- **Handle `operation: \"record\"`.** `resolveScope`, `authorize`, and the instance and route guards receive it from `s3.db.record`. A switch that lists every operation needs a `record` case.\n"
    filename: 2026-11-19-db-record-object.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/server\":\n    type: patch\n---\n\n### Confirm checks for plugins\n\n`@dimah-s3/server/plugins` exports the checks confirm already uses.\n\n- **`readObjectMetadata`.** Reads HeadObject user metadata, without the upload marker or the previous key.\n- **`assertFileConstraints`.** Applies a route's `fileTypes` and `maxFileSize`, and rejects an empty file.\n- **`operation: \"record\"`.** Guards can see it. `s3.db.record` is not an HTTP route.\n\n#### Breaking changes\n\n- **Handle `operation: \"record\"`.** A switch on `S3Operation` needs a `record` case. Only `s3.db.record` sends it.\n"
    filename: 2026-11-19-plugin-object-metadata.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/ui\":\n    type: minor\n---\n\n### Open New folder and a row menu from outside\n\n`useObjectListCommands()` opens list UI that your own shortcut or menu cannot reach by itself. Pass the object to `ObjectList` as `commands`.\n\n- **`startNewFolder()`.** Opens the New folder name field. It does nothing when the source has no `createFolder`.\n- **`openMenu(entryKey)`.** Opens that row's menu. It does nothing when the entry is not on screen.\n- **Right-click.** On a row with the default menu, the browser menu stays closed and the row menu opens.\n"
    filename: 2026-11-19-object-list-commands.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/ui\":\n    type: patch\n---\n\n### Search opens on slash, not on Shift+/\n\n`ObjectList` opens its search on `/`. Shift+/ stays with your page, so `?` and the Persian «؟» can be your own shortcut.\n\n- **`/`.** The slash character opens search from the list, on any key, including when a layout types it with Shift.\n- **The unshifted slash key.** A layout that types a character outside ASCII there still opens search. A layout that types another ASCII character, such as `.` on a Persian layout, keeps that character.\n- **Shift+slash.** `?` and «؟» do not open search.\n"
    filename: 2026-11-19-object-list-search-key.md
    v: 0.0.0
