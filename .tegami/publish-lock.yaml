core:changelogs:
  - content: "---\npackages:\n  \"@dimah-s3/cli\":\n    type: major\n---\n\n### `create` refuses typos, cancels cleanly, and starters commit their lockfile\n\n`dimah-s3 create` stops on an argument it does not know, cleans up after Ctrl+C, and installs the way you would. A new app commits its lockfile and comes with an `AGENTS.md`.\n\n- **Install.** `create` runs your package manager's own install in the new project (`pnpm install`, `npm install`, `yarn`, `bun install`). A pnpm install reads the starter's `pnpm-workspace.yaml`, and nothing goes through corepack.\n- **Ctrl+C.** Cancelling while a step runs stops the install, removes the directory `create` made, and exits with `130`. Files written into a directory that already existed are left in place.\n- **`AGENTS.md`.** Each starter ships its notes for the app's coding agent.\n- **`pnpm-workspace.yaml`.** It is kept for pnpm and removed for npm, yarn, and bun. It excludes `@dimah-s3/*` and `react-dropzone` from pnpm's release-age wait.\n- **Starter server setup.** All three starters read the required `S3_*` variables through one `env()` helper that names the missing variable, leave `DIMAH_S3_SECRET` to the server, and carry a commented `guard` stub on the `avatar` route, which is open until you add one.\n- **`start` without a `.env` file.** The Vite and Hono starters start with `--env-file-if-exists`, and `tsx` is a dependency, so a host that injects the environment can run them.\n- **`--no-src`.** The README of a flattened Next.js app names the flattened paths.\n- **Non-empty directory.** The question comes right after the project name, before the other prompts.\n- **Errors** are written to stderr.\n\n#### Breaking changes\n\n- **Use Node.js 22 or newer.** `engines.node` is `>=22`. It was `>=20.19`.\n- **Fix unknown options and extra arguments.** `create --templte vite my-app` and `create my-app extra` fail with exit code `1` before anything is written. They used to be ignored, and the first one scaffolded the default starter into `./vite`.\n- **Give the project an ASCII name.** A directory name with no ASCII letter or digit fails. The package used to be named `my-app`.\n- **Expect exit code `1` after a \"no\" to replacing a non-empty directory.** It was `130`, which now only means Ctrl+C.\n- **Commit the lockfile.** The starter `.gitignore` no longer ignores `pnpm-lock.yaml`, `package-lock.json`, and `yarn.lock`.\n- **Set every required variable before `next build`.** The Next.js starter reads `S3_ACCESS_KEY_ID`, `S3_SECRET_ACCESS_KEY`, and `S3_BUCKET` when its route module loads, and a missing one throws by name. Only `S3_BUCKET` was needed at build time.\n- **Run the bin.** The package has no importable entry: `import \"@dimah-s3/cli\"` used to run the CLI. Use `npx @dimah-s3/cli create`.\n"
    filename: 2026-11-20-cli-final-beta.md
    v: 0.0.0
  - content: "---\npackages:\n  group:dimah-s3:\n    type: major\n---\n\n### One Node.js floor and bounded peer ranges\n\nEvery `@dimah-s3/*` package declares `engines.node` `>=22`, exports its `package.json`, and names the peer majors it is built against. Keep every `@dimah-s3/*` package on the same version.\n\n- **`./package.json`.** Every package exports it, so a tool can read the installed version: `import pkg from \"@dimah-s3/core/package.json\" with { type: \"json\" }`.\n- **`funding`.** Every package links the sponsor page.\n\n#### Breaking changes\n\n- **Use Node.js 22 or newer.** Every package declares `engines.node` `>=22`. Only `@dimah-s3/cli` declared a floor before (`>=20.19`).\n- **Check your peer versions.** Open-ended ranges such as `>=19.2` now end at the next major:\n  - `@dimah-s3/react` and `@dimah-s3/ui`: `react` `^19.2.0`.\n  - `@dimah-s3/ui`: `react-dom` `^19.2.0` (a new peer), `@base-ui/react` `^1.0.0`, `class-variance-authority` `^0.7.0`, `cn` `^0.5.2`, and `lucide-react` `>=0.400.0 <2`.\n  - `@dimah-s3/server` and `@dimah-s3/db`: `@aws-sdk/client-s3` `^3.0.0`.\n  - `@dimah-s3/db`: `kysely` `^0.29.8`.\n- **Install `@aws-sdk/client-s3` next to `@dimah-s3/db`.** It is a required peer. It was marked optional, but the plugin imports it.\n"
    filename: 2026-11-20-package-manifests.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/core\":\n    type: major\n---\n\n### One name for client metadata\n\nThe upload body, the client option, and the server hooks all call the client's extras `clientMetadata`, so `metadata` always means the object's S3 user metadata.\n\n- **`QUOTA_EXCEEDED` names a third cap.** Its `limit` param can be `\"folders\"`, next to `\"bytes\"` and `\"files\"`, for the folder cap of `db()`.\n\n#### Breaking changes\n\n- **Send `clientMetadata`, not `metadata`.** The upload and multipart init bodies (`UploadPayload`, `MultipartInitPayload`, `uploadBodySchema`, `multipartInitBodySchema`) take `clientMetadata`. A body that still sends `metadata` fails with `VALIDATION_ERROR`. A custom `S3Api` reads `payload.clientMetadata`.\n- **`metadataSchema` is `clientMetadataSchema`**, and `S3_MAX_METADATA_ENTRIES` is `CLIENT_METADATA_MAX_ENTRIES`.\n- **`UNKNOWN_ROUTE` is `ROUTE_NOT_FOUND`**, like `OBJECT_NOT_FOUND` and `FOLDER_NOT_FOUND`. The status stays `404` and the message is unchanged.\n- **`buildPublicObjectUrl({ baseUrl })` is `buildPublicObjectUrl({ baseURL })`**, spelled like `createS3Client({ baseURL })`.\n"
    filename: 2026-11-20-client-metadata.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/db\":\n    type: major\n---\n\n### Schema 2.3.0 and a folder-aware authorize\n\n`db()` reads schema `2.3.0`, `authorize` sees the folder a stored object is in, and the stores take the scope as their first argument.\n\n- **`authorize` sees where the target is.** `folder` and `folderId` are set for download, delete, read, confirm, and the multipart calls too, read from the object's row. A rule on `folder` now covers every way to reach an object. The folder is read only when `authorize` is configured.\n- **`destination`.** A move of an object, a rename or move of a folder, and `POST /db/folder` pass `destination: { folder, folderId }`: where the call puts the target.\n- **A refused upload leaves no row.** When confirm, multipart complete, or `s3.put` refuses an upload and the server deletes its object, the plugin removes that upload's row through `upload.onRejected`, including an active row the upload was overwriting.\n- **Name sort.** `sort: { field: \"name\" }` orders by the folded name that search matches, so case and accents do not count on SQLite, PostgreSQL, and MySQL alike. `s3.db.folders.children` and `descendants` list folders in that order.\n- **`maxFolders`.** A `quota` can cap the folders of a scope. `POST /db/folder` past the cap is `QUOTA_EXCEEDED` with `limit: \"folders\"`. `s3.db.folders.count(scope)` returns the number.\n- **A file-only quota counts rows.** With `maxFiles` and no `maxBytes`, the quota check is one `COUNT`.\n- **Folder moves hold under concurrency.** A subfolder created while its parent is renamed gets its new path, a parent deleted during a create or a move is put back, and two moves that would put each folder inside the other end with one undone and `CONFLICT`.\n- **The schema check reads the tables.** `checkSchema` and the first query also read one row of each table, so a database the generated schema was never applied to fails there, with what to run.\n- **`DB_FOLDER_ID_KEY`.** `@dimah-s3/db` and `@dimah-s3/db/client` export the `clientMetadata` key an upload names its folder with (`\"folderId\"`).\n- **`dbObjectSource`.** `usage: true` asks for the usage line without a quota, and `limit` is clamped to 1 to 100.\n- **`s3.db.record` names.** A name follows the rule of an uploaded file name, and the default name from the key is fitted to it.\n\n#### Breaking changes\n\n- **Create schema `2.3.0` on a new database.** `storage_object.filename` is `name`, and `e_tag` is `etag`. `route` is `varchar(64)` and `acl` is `varchar(16)`. `storage_object_scope_filename_idx` is `storage_object_scope_name_idx` on `(scope, status, search_name)`, and the unique `storage_folder_scope_path_uk` is the plain index `storage_folder_scope_path_idx`. On MySQL, `name` uses `utf8mb4_bin` like every other text column. Generate the Drizzle or Prisma schema again with `runCli`, or call `migrate(client)` on an empty database. A database at another version throws.\n- **`filename` is `name`.** Read `StorageObject.name` and `DbClientObject.name`. Send `name` in `PATCH /db/object`, `api.db.updateObject({ name })`, and `s3.db.objects.update(ref, { name })`. The sort field is `\"name\"`.\n- **`authorize`: `folder` and `folderId` are where the target is now.** A move of an object and a rename or move of a folder report the new place in `destination`, not in `folder`. `POST /db/folder` reports the parent in `folder` and the new path in `destination.folder`. Read `destination?.folder` where a rule read `folder` for those calls.\n- **A flat listing asks `authorize` for the whole scope.** `GET /db/objects` without `folderId` passes `folder: null`, `folderId: null`, and `recursive: true`. A rule that returns `false` for `recursive` now refuses it: list with a `folderId`, or allow `recursive` at the root.\n- **Folder operations have their own names.** `resolveScope`, `authorize`, and a `quota` function receive `\"folder.create\"` for `POST /db/folder`, `\"folder.update\"` for `PATCH /db/folder`, and `\"folder.delete\"` for `DELETE /db/folder`. `\"update\"` is `PATCH /db/object` only.\n- **The stores take the scope first.**\n  - `s3.db.objects.list({ scope, ...filter })` → `s3.db.objects.list(scope, filter)`.\n  - `s3.db.objects.count({ scope, ...filter })` → `s3.db.objects.count(scope, filter)`.\n  - `s3.db.objects.getUsage(scope)` → `s3.db.objects.usage(scope)`.\n  - `ObjectFilter` and `ListObjectsInput` have no `scope`.\n- **`s3.db.folders.retain` is removed.** The plugin puts a folder back itself after it writes into one.\n- **Ask for `usage` when there is no quota.** `GET /db/objects` sends `usage` on the first page when the plugin sets a `quota`, or when the query has `usage=true`. Pass `dbObjectSource(api.db, { usage: true })` or `api.db.listObjects({ usage: true })` to keep the usage line without a quota.\n- **`DimahS3DB` is `DimahS3Db`.**\n- **Import `migrate` from `@dimah-s3/db`.** `@dimah-s3/db/cli` exports `runCli` only.\n- **Client types name the object.** `DbClientGetInput` → `DbClientGetObjectInput`, `DbClientUpdateInput` → `DbClientUpdateObjectInput`, `DbClientListInput` → `DbClientListObjectsInput`, and `DbClientListResponse` → `DbClientListObjectsResponse`.\n- **`@dimah-s3/db/client` does not export `StorageObjectStatus`.** Use `DbClientObjectStatus`, which `@dimah-s3/db` exports too. `StorageObjectStatus` stays on `@dimah-s3/db`.\n- **A scope cannot be empty or have whitespace at either end.** `resolveScope` returning one fails the call with `500 INTERNAL_ERROR` and logs the reason.\n- **A folder name cannot start or end with whitespace.** It is `FOLDER_INVALID`.\n- **`s3.db.record` checks `name` like an upload.** It is 1 to 255 UTF-8 bytes with no control or bidi characters, and may contain `/`. A name of up to 255 characters that is longer than 255 bytes is now a `VALIDATION_ERROR`.\n"
    filename: 2026-11-20-db-final-beta.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/react\":\n    type: major\n---\n\n### Retries that keep the upload, and names that match the server\n\nUploads recover from a failing gateway or server hook instead of starting over, and the hooks use the same words as the server and the engine.\n\n- **Retries follow the server.** A request is sent again after a network error, an S3 `5xx`, `408`, or `429`, and any API response with `5xx`, `408`, or `429`, which includes `INTERNAL_ERROR` from a gateway or from a server hook that failed. Confirm and multipart complete are retried, and with an `uploadStore` a multipart upload that fails this way stays stored and resumes. `HOOK_FAILED` is never retried. `useObjectUrl` follows the same rule.\n- **Uploads work on plain-HTTP origins.** File ids no longer come from `crypto.randomUUID`, which a phone on `http://192.168.…` does not have.\n- **`handleFiles` reports rejected files.** `UploadBatchResult` gains `rejected`: the files a call refused for their type, size, or count, with their errors.\n- **`cancel(ids)` and `reset(ids)`** take one id or several. `reset(ids)` removes only those settled files and keeps the rejections.\n- **`retry()` keeps calls apart.** Failed files of separate calls go again as separate calls, also when the calls shared one options object.\n- **`useDelete` callbacks are current.** `onSuccess`, `onError`, and `onSettled` run from the newest render, as in the other hooks.\n- **Types.** `UploadCallInput`, `UploadRootProps`, and `UploadInputProps` are exported, and `onError` may return a promise in every hook.\n\n#### Breaking changes\n\n- **`@dimah-s3/core` is a peer dependency.** Install it at the same version as `@dimah-s3/react`.\n- **`uploadOptions.metadata` is `uploadOptions.clientMetadata`**, the name the server hooks use. `UploadResult.metadata` is still the object's S3 user metadata.\n- **`queue` is `append`** on `useUpload` and on a `handleFiles` call.\n- **`useApi` is `useS3Api`.** The bound `s3Client.useApi()` keeps its name.\n- **Download hooks: `mode` is `kind`.** `useDownload().kind` is `\"navigate\"` and `useFetchDownload().kind` is `\"fetch\"`. A download result still has `mode`, which is `\"presign\"` or `\"proxy\"`.\n- **`useFetchDownload`.** The `disposition` option is removed, since the bytes are always saved, and `FetchDownloadResult.size` is `fileSize`.\n- **Object lists.** The source's `getKey` is `getId`, and `removeItems` takes those ids.\n- **Upload stores.** `createMemoryStore` is `createMemoryUploadStore`, and `createLocalStorageStore` is `createLocalStorageUploadStore`.\n- **`retry.baseDelay` is `retry.baseDelayMs`.**\n- **`onPartUpload`** receives `{ partNumber, partCount }`: `totalParts` is `partCount`.\n- **`DropzoneRootProps` and `DropzoneInputProps`** are `UploadRootProps` and `UploadInputProps`.\n- **File ids are not UUIDs.** `UploadFileState.id` is an opaque string. Do not parse it.\n- **`UNKNOWN_ROUTE` is `ROUTE_NOT_FOUND`.**\n- **Browsers from Baseline 2024.** The hooks use `Promise.withResolvers` and `AbortSignal.any`: Chrome 119, Firefox 124, Safari 17.4, or newer.\n"
    filename: 2026-11-20-react-retries-and-names.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/server\":\n    type: major\n---\n\n### A hook for rejected uploads, and one vocabulary in hook contexts\n\nA refused upload now reports back, and the upload hooks name things the way the rest of the API does.\n\n- **`upload.onRejected`.** Runs after confirm, multipart complete, or `s3.put` refuses an upload and deletes its object: a size, type, or content mismatch, a `confirmGuard` rejection, or a plugin that rejects it. The context has the key, `kind`, `uploadToken`, the declared `file`, and the `error` the client receives. Undo there what `onStart` recorded. A throw is logged and passed to `onError`, and the client still gets the rejection. A plugin adds it under `hooks.upload.onRejected`.\n- **`PUT` plugin endpoints.** `createS3Endpoint` accepts `method: \"PUT\"`, which reads a JSON body like `POST` and `PATCH`.\n- **An empty `secret` counts as not set.** `dimahS3({ secret: process.env.MY_SECRET })` falls back to `DIMAH_S3_SECRET` while the variable is missing or empty, so the option needs no `|| undefined`.\n\n#### Breaking changes\n\n- **Upload kinds.** `kind` is `\"presignedPost\"`, `\"presignedPut\"`, `\"multipart\"`, or `\"server\"`: `\"post\"` is `\"presignedPost\"` and `\"put\"` is `\"presignedPut\"`. `operation: \"put\"` is still `s3.put`, whose kind is `\"server\"`.\n- **`upload.multipart.guard` narrows on `operation`.** The context has no `action`. Compare `operation` with `\"multipart.signPart\"`, `\"multipart.listParts\"`, `\"multipart.complete\"`, or `\"multipart.abort\"`. `partNumber` and `size` are on the `\"multipart.signPart\"` context.\n- **`clientMetadata` on `s3.api`.** `s3.api.upload` and `s3.api.multipart.init` take `clientMetadata`, as `s3.put` and the hooks do. `metadata` is rejected with `VALIDATION_ERROR`.\n- **`UNKNOWN_ROUTE` is `ROUTE_NOT_FOUND`.**\n- **`secret: []` falls back to `DIMAH_S3_SECRET`** instead of throwing when `dimahS3()` runs.\n"
    filename: 2026-11-20-upload-on-rejected.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@dimah-s3/ui\":\n    type: major\n---\n\n### Entry menu, a smaller list context, and named icon buttons\n\n`ObjectList` calls its row menu `ObjectListEntryMenu` and shares a smaller, documented context with parts of your own. Icon-size triggers keep an accessible name, Copy link works in Safari, and registry items install the 2.x packages.\n\n- **Registry items install 2.x.** Every item pins `@dimah-s3/core` and `@dimah-s3/react` to the 2.x line, so `shadcn add` never installs another major next to the copied source. The items need a shadcn project on a Base UI style; the npm package bundles its primitives and works anywhere.\n- **`ObjectListEntryMenuItem`.** A row for the `children` of `ObjectListEntryMenu`, with `onClick`, `disabled`, and `destructive`. Use it for a row that `actions` cannot describe.\n- **Entry menu names.** The menu button of a row is named after its entry, \"Actions for report.pdf\", in place of \"File actions\" and \"Folder actions\". Tests that find the button by name need the new one.\n- **Copy link in Safari.** The clipboard write starts inside the click, through a `ClipboardItem` that resolves once the URL is signed. Browsers without `ClipboardItem` keep `writeText`.\n- **Icon-size triggers keep a name.** `UploadTrigger`, `DownloadTrigger`, and `DeleteTrigger` at an icon `size` render their default label visually hidden, so the button has an accessible name without an `aria-label`. `UploadTrigger` now shows the icon alone at an icon `size`.\n- **`AvatarUpload` announces once.** Its live region stays silent while an `UploadToasts` is mounted for the same hook, which reads the same messages out.\n- **Translated accessible names.** The breadcrumb navigation is named \"Folder path\" through the translations. The spinner inside a busy New folder, Rename, Load more, or bulk Delete button is hidden from assistive technology, so the button keeps its own name.\n- **`onDismissed` on a delete request.** `request(targets, { onDismissed })` from `useDeleteContext()` runs when the confirm dialog closes without deleting, or another request replaces it. The bulk Delete button of `ObjectList` is no longer busy for keys whose dialog was dismissed.\n- **`ObjectListRow` and `ObjectListTile` provide their entry.** The default menu works on a row that `renderEntry` returns.\n- **Prop types.** Every exported component has an exported `*Props` type: `ObjectListBreadcrumbProps`, `ObjectListBulkDeleteProps`, `ObjectListCheckboxProps`, `ObjectListContentProps`, `ObjectListSelectAllProps`, `ObjectListSortMenuProps`, `ObjectListUploadStatusProps`, `ObjectListUsageProps`, and `ObjectListViewToggleProps` are new. `ObjectListBulkDelete` and `DismissAttachmentAction` take a `className`.\n- **Declarations without `react-file-icon`.** The published types no longer import `react-file-icon`, which ships none, so `skipLibCheck: false` passes.\n- **`useToastOwner` without a bundler.** It no longer reads `process` where there is none.\n\n#### Breaking changes\n\n- **Rename `ObjectListItemMenu` to `ObjectListEntryMenu`.**\n  - `ObjectListItemMenuProps` → `ObjectListEntryMenuProps`.\n  - `ObjectListMenuAction` → `ObjectListEntryMenuAction`.\n  - `data-slot=\"object-list-item-menu\"` → `data-slot=\"object-list-entry-menu\"`.\n  - The registry file `list/object-list-item-menu.tsx` → `list/object-list-entry-menu.tsx`.\n  - Pass `ObjectListEntryMenuItem` children in place of your own `DropdownMenuItem`.\n- **Read less from `useObjectListContext()`.** It returns `list`, `selection`, `upload`, `download`, `share`, `delete`, `toasts`, `announce`, `view`, `setView`, `rootLabel`, `startNewFolder`, `startRename`, and `revealEntry`.\n  - `label` → `rootLabel`.\n  - `setNewFolderOpen(true)` → `startNewFolder()`. `newFolderOpen` is removed; the field closes itself.\n  - `sizing`, `showBreadcrumb`, `selectionActions`, `empty`, `pagination`, `onOpenItem`, `resolveFolderKeys`, `renamingKey`, `endRename`, and the four `render*` functions are removed from the context. Read them from the props you pass to `ObjectList`.\n- **Rename the type `ObjectListPagination` to `ObjectListPaginationMode`.**\n- **Rename `AvatarUpload` `onChange` to `onUploaded`.** It still runs once per uploaded image with the `UploadResult`.\n- **Rename `ObjectListSearch` `delay` to `debounceMs`.**\n- **Remove your `--dimah-s3-accent` and `--dimah-s3-primary-foreground` overrides.** No component read these tokens. The `*-dimah-s3-accent` and `*-dimah-s3-primary-foreground` utilities are removed with them.\n- **Give `CircleProgress` a `fileName` or a `label`.** The type requires one of them, since they name the progress bar.\n- **Drop `onRetry` and `retryDisabled` from `ObjectCard`, and `children` from `DownloadProgress`.** They never had an effect, and the types no longer accept them.\n- **Update these translation keys.** A key is its English text and note, so a changed note is a new key.\n  - `\"You can upload {count} files(dropzone hint)\"`, `\"Each up to {size}(dropzone hint)\"`, and `\"Up to {size}(dropzone hint)\"` end with a period: `\"You can upload {count} files.(dropzone hint)\"`, `\"Each up to {size}.(dropzone hint)\"`, `\"Up to {size}.(dropzone hint)\"`. The hint joins whole sentences with a space.\n  - `\", (list separator)\"` is new. It separates the accepted types in `\"Accepted {types}.(dropzone hint)\"`.\n  - `\"Upload failed(status)\"` → `\"Upload failed(upload status)\"`, and `\"All {count} files uploaded(status)\"` → `\"All {count} files uploaded(upload status)\"`.\n  - `\"Upload progress(progress)\"` → `\"Upload progress(upload progress)\"`.\n  - `\"Failed(status)\"` → `\"Failed(attachment status)\"`.\n  - `\"This link works while you can access this file.\"` and the eight `\"Expires in …\"` keys move from the note `object list menu` to `share link`.\n  - The rename field uses `\"Folder name(object list rename)\"`, `\"Enter a folder name(object list rename)\"`, and `\"Save name(object list rename)\"` for its submit button, in place of the new-folder and menu keys.\n  - `\"Actions for {name}(object list menu)\"` and `\"Folder path(object list)\"` are new.\n"
    filename: 2026-11-20-ui-final-beta.md
    v: 0.0.0
