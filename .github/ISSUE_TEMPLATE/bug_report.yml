name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it.
        Usage questions belong in [Discussions](https://github.com/dimah-kz/dimah-s3/discussions) or the [docs](https://s3.dimah.dev/docs).
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@dimah-s3/core"
        - "@dimah-s3/server"
        - "@dimah-s3/react"
        - "@dimah-s3/ui"
        - "@dimah-s3/db"
        - "@dimah-s3/cli"
        - Docs
        - Templates / examples
        - Unsure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction. A small repo or gist helps.
      placeholder: |
        1. Install package
        2. Run code
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.5.7"
  - type: dropdown
    id: provider
    attributes:
      label: S3 provider
      options:
        - Amazon S3
        - Cloudflare R2
        - MinIO
        - Other S3-compatible
        - Not applicable
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version and OS.
      placeholder: "Node 24, Windows 11"
