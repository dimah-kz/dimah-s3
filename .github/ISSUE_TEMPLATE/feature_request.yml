name: Feature request
description: Suggest an idea for dimah-s3
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please check the [docs](https://s3.dimah.dev/docs) and existing issues first.
        Questions belong in [Discussions](https://github.com/dimah-kz/dimah-s3/discussions).
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@dimah-s3/core"
        - "@dimah-s3/server"
        - "@dimah-s3/react"
        - "@dimah-s3/ui"
        - "@dimah-s3/db"
        - "@dimah-s3/cli"
        - Docs
        - Templates / examples
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API or behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional alternatives or trade-offs.
