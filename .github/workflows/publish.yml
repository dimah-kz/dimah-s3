# Versions or publishes the release line after CI passes on a push to it.
#
# `workflow_run` always runs this file from the default branch, then checks
# out the commit that CI built. Keep the branch lists here and in `ci.yml` in
# step with `lines` in scripts/tegami.mts.
name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, v2]
  workflow_dispatch:

# Queue releases. Never cancel one halfway through a publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Version & Publish
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'v2') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # No restored or remote Turbo cache: every published file is built in
      # this job from the released commit.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "false"

      # Versions when pending `.tegami/*.md` changelogs exist (opens a Version
      # Packages PR). Otherwise publishes from `.tegami/publish-lock.yaml`.
      # Package builds run in `willPublish` (see scripts/tegami.mts).
      # npm trusted publishing uses OIDC (`id-token: write`) — no NPM_TOKEN.
      # Do not set registry-url / NODE_AUTH_TOKEN here; they block OIDC.
      # workflow_run keeps GITHUB_REF on the default branch. Pass the branch CI
      # built so tegami selects `latest` (main) or `beta` (v2).
      - name: Version & publish packages
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          TURBO_TELEMETRY_DISABLED: "1"
