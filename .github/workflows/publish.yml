name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  publish:
    name: Version & Publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Versions when pending `.tegami/*.md` changelogs exist (opens a Version
      # Packages PR). Otherwise publishes from `.tegami/publish-lock.yaml`.
      # Package builds run in `willPublish` (see scripts/tegami.mts).
      # npm trusted publishing uses OIDC (`id-token: write`) — no NPM_TOKEN.
      # Do not set registry-url / NODE_AUTH_TOKEN here; they block OIDC.
      - name: Version & publish packages
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
