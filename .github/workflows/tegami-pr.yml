# Builds the release preview for a pull request. Runs on `pull_request` (not
# `pull_request_target`), so it executes untrusted code and stays read-only.
# `tegami-pr-comment.yml` posts the comment and starts from this workflow by
# name. Keep `name: Tegami PR`.
name: Tegami PR

on:
  pull_request:
    branches: [main, v2]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Release preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The root `tegami` CLI only. Skips workspace postinstalls.
      - uses: ./.github/actions/setup
        with:
          install-filter: dimah-s3...
          turbo-cache: "false"

      - name: Release preview
        run: pnpm tegami pr preview --artifact tegami-pr-preview.md

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: tegami-pr-preview
          path: tegami-pr-preview.md
          retention-days: 1
