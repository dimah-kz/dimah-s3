name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Remote cache: repo secret TURBO_TOKEN + variable TURBO_TEAM (Vercel team slug).
# Without them, jobs still share a local .turbo cache via actions/cache.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Examples / templates drift
        run: pnpm examples:drift

  packages:
    name: Build, Test & Types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'tooling/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - 'scripts/templates-*.mjs'
            templates:
              - 'templates/**'
              - 'scripts/templates-*.mjs'

      - name: Resolve Turbo affected range
        if: steps.filter.outputs.packages == 'true'
        uses: ./.github/actions/turbo-affected-range

      - name: Setup
        if: steps.filter.outputs.packages == 'true' || steps.filter.outputs.templates == 'true'
        uses: ./.github/actions/setup

      - name: Build, test, and typecheck packages
        if: steps.filter.outputs.packages == 'true'
        run: pnpm turbo run build test check-types --affected --filter="./packages/*"

      # templates/ is outside the workspace, so --affected never sees it.
      # CLI snapshot (build) is the cheap check; full templates:build stays local.
      - name: Snapshot CLI templates
        if: steps.filter.outputs.templates == 'true'
        run: pnpm turbo run build --filter=@dimah-s3/cli

  registry:
    name: Validate Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            registry:
              - 'registry.json'
              - 'packages/ui/**'

      - name: Setup
        if: steps.filter.outputs.registry == 'true'
        uses: ./.github/actions/setup

      - name: Validate registry
        if: steps.filter.outputs.registry == 'true'
        run: pnpm registry:validate

      - name: Check generated registry.json
        if: steps.filter.outputs.registry == 'true'
        run: git diff --exit-code -- packages/ui/registry.json

  apps:
    name: Typecheck Apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apps:
              - 'apps/**'
              - 'examples/**'
              - 'packages/**'
              - 'registry.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

      - name: Resolve Turbo affected range
        if: steps.filter.outputs.apps == 'true'
        uses: ./.github/actions/turbo-affected-range

      # docs / examples postinstall (fumadocs-mdx, native addons) is required.
      - name: Setup
        if: steps.filter.outputs.apps == 'true'
        uses: ./.github/actions/setup
        with:
          ignore-scripts: "false"

      # Dist types come from package builds. Skip docs/brand/examples themselves
      # (typecheck only; Next production build is Vercel / local for brand).
      - name: Build workspace dependencies
        if: steps.filter.outputs.apps == 'true'
        run: pnpm turbo run build --filter=docs... --filter=brand... --filter="./examples/*..." --filter=!docs --filter=!brand --filter="!./examples/*"

      - name: Typecheck apps and examples
        if: steps.filter.outputs.apps == 'true'
        run: pnpm turbo run check-types --affected --filter="./apps/*" --filter="./examples/*"
