name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Remote cache: set repo secret TURBO_TOKEN + variable TURBO_TEAM (Vercel team slug).
# Without them, jobs still share a local .turbo cache via actions/cache.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Turbo affected range
        uses: ./.github/actions/turbo-affected-range

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint (affected)
        run: pnpm turbo run lint --affected

      - name: Format check
        run: pnpm format:check

  packages:
    name: Build, Test & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'tooling/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'package.json'
              - 'scripts/templates-shared.mjs'

      - name: Resolve Turbo affected range
        if: steps.filter.outputs.packages == 'true'
        uses: ./.github/actions/turbo-affected-range

      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.packages == 'true'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.packages == 'true'
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        if: steps.filter.outputs.packages == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - if: steps.filter.outputs.packages == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages (affected)
        if: steps.filter.outputs.packages == 'true'
        run: pnpm turbo run build --affected --filter="./packages/*"

      - name: Test packages (affected)
        if: steps.filter.outputs.packages == 'true'
        run: pnpm turbo run test --affected --filter="./packages/*"

      - name: Type check packages (affected)
        if: steps.filter.outputs.packages == 'true'
        run: pnpm turbo run check-types --affected --filter="./packages/*"

  registry:
    name: Validate Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            registry:
              - 'registry/**'
              - 'packages/ui/**'
              - 'packages/react/**'
              - 'packages/core/**'

      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.registry == 'true'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.registry == 'true'
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        if: steps.filter.outputs.registry == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - if: steps.filter.outputs.registry == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Synced registry sources import @dimah-s3/{core,react}; types come from dist/.
      - name: Build package deps
        if: steps.filter.outputs.registry == 'true'
        run: pnpm turbo run build --filter=@dimah-s3/react

      - name: Sync registry sources
        if: steps.filter.outputs.registry == 'true'
        run: pnpm --filter @dimah-s3/ui sync-registry

      - name: Validate registry
        if: steps.filter.outputs.registry == 'true'
        run: pnpm --filter @dimah-s3/registry validate

      - name: Type check registry items
        if: steps.filter.outputs.registry == 'true'
        run: pnpm --filter @dimah-s3/registry check-types

  apps:
    name: Typecheck Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apps:
              - 'apps/**'
              - 'packages/core/**'
              - 'packages/react/**'
              - 'packages/server/**'
              - 'packages/ui/**'
              - 'registry/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

      - name: Resolve Turbo affected range
        if: steps.filter.outputs.apps == 'true'
        uses: ./.github/actions/turbo-affected-range

      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.apps == 'true'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.apps == 'true'
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        if: steps.filter.outputs.apps == 'true'
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      # docs postinstall (fumadocs-mdx) is required for typegen / tsc.
      - if: steps.filter.outputs.apps == 'true'
        run: pnpm install --frozen-lockfile

      # Build docs deps so package `exports.types` (dist/) exist, then typecheck.
      # Full `next build` for docs runs on Vercel (with turbo-ignore).
      - name: Build docs dependency packages
        if: steps.filter.outputs.apps == 'true'
        run: pnpm turbo run build --filter=docs... --filter=!docs

      - name: Type check apps (affected)
        if: steps.filter.outputs.apps == 'true'
        run: pnpm turbo run check-types --affected --filter="./apps/*"
