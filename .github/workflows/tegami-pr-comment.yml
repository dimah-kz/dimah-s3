# Posts the release-preview artifact from `tegami-pr.yml` as a PR comment.
# Triggered by `workflow_run` so it runs in the base-repo context with write
# permissions, without executing the PR's code. The preview file is produced
# by that untrusted run: download it outside the workspace and check that it
# is a single regular file before the trusted `tegami` command reads it.
name: Tegami PR Comment

on:
  workflow_run:
    workflows: ["Tegami PR"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post preview comment
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Comment step only needs root tegami; skip workspace postinstalls.
        run: pnpm install --frozen-lockfile --ignore-scripts --filter=dimah-s3...

      - name: Download preview
        uses: actions/download-artifact@v8
        with:
          name: tegami-pr-preview
          path: ${{ runner.temp }}/tegami-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate preview artifact
        env:
          PREVIEW_DIR: ${{ runner.temp }}/tegami-preview
        run: |
          shopt -s nullglob dotglob
          entries=("$PREVIEW_DIR"/*)
          preview="$PREVIEW_DIR/tegami-pr-preview.md"
          if [[ ${#entries[@]} -ne 1 || "${entries[0]}" != "$preview" || -L "$preview" || ! -f "$preview" ]]; then
            echo "::error::Artifact must contain only a regular file named tegami-pr-preview.md"
            exit 1
          fi
          bytes=$(stat -c%s "$preview")
          if (( bytes > 262144 )); then
            echo "::error::Preview artifact is larger than 256 KiB"
            exit 1
          fi

      - name: Post preview comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_FILE: ${{ runner.temp }}/tegami-preview/tegami-pr-preview.md
        run: pnpm tegami pr comment "$PREVIEW_FILE"
