# Labels pull requests by changed paths. Every label here must exist in
# .github/labels.yml.

"area:core":
  - changed-files:
      - any-glob-to-any-file: packages/core/**

"area:server":
  - changed-files:
      - any-glob-to-any-file: packages/server/**

"area:react":
  - changed-files:
      - any-glob-to-any-file: packages/react/**

"area:ui":
  - changed-files:
      - any-glob-to-any-file:
          - packages/ui/**
          - registry.json

"area:db":
  - changed-files:
      - any-glob-to-any-file: packages/db/**

"area:cli":
  - changed-files:
      - any-glob-to-any-file:
          - packages/cli/**
          - templates/**

"area:examples":
  - changed-files:
      - any-glob-to-any-file: examples/**

"area:tooling":
  - changed-files:
      - any-glob-to-any-file:
          - tooling/**
          - scripts/**
          - turbo.json
          - pnpm-workspace.yaml

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - apps/docs/**
          - docs/**

dependencies:
  - changed-files:
      - any-glob-to-any-file: pnpm-lock.yaml

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

release:
  - changed-files:
      - any-glob-to-any-file: .tegami/publish-lock.yaml
