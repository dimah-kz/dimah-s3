name: Setup
description: >
  Install pnpm (from `packageManager`), Node.js (from `.node-version`), and the
  workspace dependencies, and restore the local Turbo cache.

# Every input is optional. The Publish workflow runs from the default branch
# and calls this action from the commit it releases, with no inputs.
inputs:
  node-version:
    description: Node.js version. Empty uses `.node-version`.
    required: false
    default: ""
  ignore-scripts:
    description: >
      Skip dependency lifecycle scripts. Set "false" when a job needs native
      addons (better-sqlite3, sharp) or postinstall codegen (fumadocs-mdx).
    required: false
    default: "true"
  install-filter:
    description: pnpm `--filter` selector. Empty installs the whole workspace.
    required: false
    default: ""
  turbo-cache:
    description: Restore and save the local `.turbo/cache` with actions/cache.
    required: false
    default: "true"
  cache-scope:
    description: >
      Turbo cache key scope. Empty uses the job id. Matrix jobs pass one value
      per leg so the legs do not overwrite each other.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
        cache: pnpm

    # Turbo hashes every task itself, so the key only needs to be unique per
    # run. The prefix restores the newest cache from this branch or its base.
    - name: Restore Turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.cache-scope || github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-scope || github.job }}-

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
        INSTALL_FILTER: ${{ inputs.install-filter }}
      run: |
        args=(--frozen-lockfile)
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then args+=(--ignore-scripts); fi
        if [[ -n "$INSTALL_FILTER" ]]; then args+=("--filter=$INSTALL_FILTER"); fi
        pnpm install "${args[@]}"
