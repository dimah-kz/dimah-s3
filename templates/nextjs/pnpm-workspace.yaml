# pnpm settings for this app. Other package managers do not read this file.
# pnpm asks before it runs a dependency's install script. These may run.
allowBuilds:
  unrs-resolver: true
  sharp: true
# pnpm waits a day before it installs a new release. The dimah-s3 packages
# are released together, and react-dropzone ships with @dimah-s3/react, so
# their new releases install at once.
minimumReleaseAgeExclude:
  - "@dimah-s3/*"
  - react-dropzone
