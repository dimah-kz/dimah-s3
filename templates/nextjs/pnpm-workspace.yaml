# Standalone starter (not part of the dimah-s3 monorepo).
# pnpm 11+ requires allowBuilds for packages with install scripts.
allowBuilds:
  unrs-resolver: true
  sharp: true
# Fresh @dimah-s3 publishes are expected from the CLI sync bump.
minimumReleaseAgeExclude:
  - "@dimah-s3/core"
  - "@dimah-s3/react"
  - "@dimah-s3/server"
  - "@dimah-s3/ui"
  - "@dimah-s3/db"
