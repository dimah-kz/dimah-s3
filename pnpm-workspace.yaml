packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tooling/*"
  # templates/* stay outside the workspace: they are CLI snapshot source with
  # published npm ranges only. Listing them here lets `pnpm -r update --latest`
  # rewrite deps to `catalog:` and prefer-workspace would link @dimah-s3/*.

catalog:
  typescript: 7.0.2
  eslint: ^10.9.0
  "@eslint/js": ^10.0.1
  "@next/eslint-plugin-next": ^16.3.2
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-turbo: ^2.10.11
  globals: ^17.11.0
  typescript-eslint: ^8.67.0
  prettier: ^3.9.6
  turbo: ^2.10.11
  tsup: ^8.5.1
  vitest: ^4.1.11
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  next: 16.3.2
  zod: ^4.4.3
  better-call: 1.4.0
  "@better-fetch/fetch": 1.3.1

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
