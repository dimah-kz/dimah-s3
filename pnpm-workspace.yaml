packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "tooling/*"
  # templates/* stay outside the workspace: they are CLI snapshot source with
  # published npm ranges only. Listing them here lets `pnpm -r update --latest`
  # rewrite deps to `catalog:` and prefer-workspace would link @dimah-s3/*.

catalog:
  typescript: 7.0.2
  eslint: ^10.10.0
  "@eslint/js": ^10.0.1
  "@next/eslint-plugin-next": ^16.3.5
  "@vitest/eslint-plugin": ^1.6.27
  eslint-config-prettier: ^10.1.8
  eslint-plugin-import-x: ^4.17.1
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-regexp: ^3.3.0
  eslint-plugin-turbo: ^2.10.13
  eslint-plugin-unicorn: ^75.0.0
  globals: ^17.12.0
  typescript-eslint: ^8.70.0
  prettier: ^3.9.6
  prettier-plugin-packagejson: ^3.0.2
  prettier-plugin-tailwindcss: ^0.7.4
  sherif: ^1.13.0
  turbo: ^2.10.13
  tsup: ^8.5.1
  vitest: ^5.0.1
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/node": ^26.6.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  next: 16.3.5
  zod: ^4.6.5
  better-call: 1.4.0
  "@better-fetch/fetch": 1.3.2
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# pnpm 12 default is 1440; keep it explicit so minimumReleaseAgeExclude is meaningful.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@rolldown/binding-openharmony-arm64@1.2.8"
  - zod@4.6.1
  - eslint-plugin-unicorn@75.0.0

engineStrict: true
linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: true
