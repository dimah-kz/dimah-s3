packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "registry"
  - "templates/*"

catalog:
  typescript: 7.0.2
  eslint: ^10.8.0
  "@eslint/js": ^10.0.1
  "@next/eslint-plugin-next": ^16.3.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-turbo: ^2.10.8
  globals: ^17.9.0
  typescript-eslint: ^8.66.0
  prettier: ^3.9.6
  turbo: ^2.10.8
  tsup: ^8.5.1
  vitest: ^4.1.10
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  next: 16.3.0

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@dimah-s3/core@0.4.1"
  - "@dimah-s3/react@0.4.1"
  - "@dimah-s3/server@0.4.1"
  - "@dimah-s3/ui@0.4.1"
